<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>全球雪景</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.5) 100%)}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.4)}

.pill{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;height:42px;padding:0 14px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;z-index:60}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;flex:none}
.pill .dot.off{background:rgba(255,255,255,.3);box-shadow:none}
.pill .dot.warn{background:rgba(255,255,255,.6);box-shadow:0 0 8px rgba(255,255,255,.4)}
.pill .txt{font-size:13px;white-space:nowrap}
.pill svg{width:12px;height:12px;opacity:.7}

.place{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:55;pointer-events:none}
.place .cn{font-size:28px;font-weight:300;letter-spacing:.15em;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.place .rg{font-size:11px;letter-spacing:.25em;color:rgba(255,255,255,.5);margin-top:4px;text-shadow:0 1px 10px rgba(0,0,0,.9)}

.wxbtn{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;display:grid;place-items:center;z-index:60;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
.wxbtn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.wxbtn.on{background:rgba(74,158,255,.4)}

.wxcard{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:220px;border-radius:18px;padding:14px 16px;z-index:59;opacity:0;pointer-events:none;transform:translateY(8px) scale(.96);transition:.3s}
.wxcard.open{opacity:1;pointer-events:auto;transform:none}
.wxcard .t{font-size:30px;font-weight:30px}
.wxcard .s{font-size:12px;color:rgba(255,255,255,.7);margin-left:6px}
.wxcard .row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.wxcard .row b{font-weight:400;color:#fff}

.mask{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:75vh;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(24,26,32,.95),rgba(10,11,14,.97));backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.15);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .4s cubic-bezier(.22,1,.36,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:10px auto}
.shead{display:flex;justify-content:space-between;padding:6px 20px 10px;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.5)}
.sbody{overflow-y:auto;padding:0 10px 10px;flex:1}
.grp{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.35);padding:12px 10px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;text-align:left;cursor:pointer}
.item:active{background:rgba(255,255,255,.08)}
.item .nm{font-size:15px}
.item .rg{display:block;font-size:10px;letter-spacing:.15em;color:rgba(255,255,255,.4);margin-top:2px}
.item .rt{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px}
.item .sd{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.item .sd.soon{background:rgba(255,255,255,.4);box-shadow:none}
.item .sd.none{background:rgba(255,255,255,.15);box-shadow:none}
.item.dim .nm{color:rgba(255,255,255,.5)}
.item.cur{background:rgba(255,255,255,.08)}
.sfoot{padding:0 10px 10px}
.demo{display:flex;align-items:center;justify-content:space-between;padding:14px;margin:4px 10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;font-size:13px;cursor:pointer}
.toggle{width:44px;height:25px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;transition:.25s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.3s}
.toggle.on{background:rgba(120,200,255,.6)}
.toggle.on::after{transform:translateX(19px)}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="vig"></div>

<button class="pill glass" id="pill">
  <span class="dot warn" id="pdot"></span>
  <span class="txt" id="ptxt">正在获取降雪…</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
</button>

<div class="place">
  <div class="cn" id="pcn">—</div>
  <div class="rg" id="prg"></div>
</div>

<button class="wxbtn" id="wxbtn" aria-label="天气">
  <svg viewBox="0 0 24 24">
    <path d="M10 4a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0V4z"/>
    <circle cx="12" cy="17" r="2.2" fill="#fff" stroke="none"/>
  </svg>
</button>

<div class="wxcard glass" id="wxcard">
  <div><span class="t" id="wtemp">—</span><span class="s" id="wcond"></span></div>
  <div class="row"><span>风速</span><b id="wwind">—</b></div>
  <div class="row"><span>未来降雪</span><b id="wsnow">—</b></div>
  <div class="row"><span>状态</span><b id="wstate">—</b></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead"><span>选择地点</span><span id="scount"></span></div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot" id="sfoot"></div>
</div>

<script>
// ========== 地点数据 ==========
var SCENES = [
  {id:"altay", name:"阿勒泰", rg:"中国 · 新疆", lat:47.85, lon:88.12},
  {id:"changbai", name:"长白山", rg:"中国 · 吉林", lat:42.00, lon:128.06},
  {id:"shangrila", name:"香格里拉", rg:"中国 · 云南", lat:27.83, lon:99.70},
  {id:"tanggula", name:"念青唐古拉", rg:"中国 · 西藏", lat:29.66, lon:91.12},
  {id:"hulunbuir", name:"呼伦贝尔雪原", rg:"中国 · 内蒙古", lat:49.22, lon:119.75},
  {id:"tianshan", name:"天山", rg:"中国 · 新疆", lat:43.79, lon:87.62},
  {id:"qilian", name:"祁连山", rg:"中国 · 青海", lat:39.58, lon:98.42},
  {id:"gongga", name:"贡嘎雪山", rg:"中国 · 四川", lat:29.59, lon:101.88},
  {id:"meili", name:"梅里雪山", rg:"中国 · 云南", lat:28.45, lon:98.88},
  {id:"daocheng", name:"稻城亚丁", rg:"中国 · 四川", lat:28.50, lon:100.30},
  {id:"fuji", name:"富士山", rg:"日本 · 静冈", lat:35.36, lon:138.73},
  {id:"sapporo", name:"札幌雪原", rg:"日本 · 北海道", lat:43.06, lon:141.35},
  {id:"matterhorn", name:"马特洪峰", rg:"瑞士 · 采尔马特", lat:45.98, lon:7.66},
  {id:"jungfrau", name:"少女峰", rg:"瑞士 · 伯尔尼", lat:46.55, lon:7.98},
  {id:"montblanc", name:"勃朗峰", rg:"法国 · 阿尔卑斯", lat:45.83, lon:6.86},
  {id:"rovaniemi", name:"罗瓦涅米", rg:"芬兰 · 拉普兰", lat:66.50, lon:25.73},
  {id:"longyearbyen", name:"朗伊尔城", rg:"挪威 · 斯瓦尔巴", lat:78.22, lon:15.62},
  {id:"tromso", name:"特罗姆瑟", rg:"挪威", lat:69.65, lon:18.96},
  {id:"banff", name:"班夫落基山", rg:"加拿大", lat:51.18, lon:-115.57},
  {id:"whistler", name:"惠斯勒", rg:"加拿大", lat:50.11, lon:-122.95},
  {id:"denali", name:"迪纳利山", rg:"美国 · 阿拉斯加", lat:63.07, lon:-151.01},
  {id:"rainier", name:"雷尼尔山", rg:"美国 · 华盛顿", lat:46.85, lon:-121.76},
  {id:"patagonia", name:"巴塔哥尼亚", rg:"阿根廷", lat:-49.22, lon:-73.03},
  {id:"kilimanjaro", name:"乞力马扎罗", rg:"坦桑尼亚", lat:-3.07, lon:37.35},
  {id:"aoraki", name:"库克山", rg:"新西兰", lat:-43.53, lon:170.14}
];

var SNOW_CODES = [71,73,75,77,85,86];
var SLEET_CODES = [66,67,68,79];

// ========== 状态 ==========
var order = [];
var curIdx = 0;
var demo = false;
var weatherOpen = false;

// ========== Canvas ==========
var cv = document.getElementById("bg");
var cx = cv.getContext("2d");
var W, H;
var stars = [];
var flakes = [];
var showSnow = false;

function resize(){
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  buildStars();
}
window.addEventListener("resize", resize);

function buildStars(){
  stars = [];
  var n = Math.floor(W * H / 1200);
  for(var i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.7,
      r: Math.random()*1.1+0.3,
      a: Math.random()*0.5+0.2,
      spd: Math.random()*0.0018+0.0005,
      ph: Math.random()*Math.PI*2
    });
  }
}

function buildFlakes(on){
  showSnow = on;
  flakes = [];
  if(!on) return;
  for(var i=0;i<400;i++){
    flakes.push({
      x: Math.random()*W,
      y: Math.random()*-H,
      r: Math.random()*2.2+0.6,
      vy: Math.random()*1.2+0.6,
      vx: Math.random()*0.4-0.2,
      ph: Math.random()*Math.PI*2
    });
  }
}

function drawScene(){
  var g = cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#060c1e");
  g.addColorStop(0.5,"#102242");
  g.addColorStop(1,"#1e3860");
  cx.fillStyle = g;
  cx.fillRect(0,0,W,H);
}

function drawMountains(){
  cx.fillStyle = "#152036";
  cx.beginPath();
  cx.moveTo(0,H);
  for(var x=0;x<=W;x+=100){
    var h = H*0.35 + Math.sin(x*0.008)*H*0.15;
    cx.lineTo(x,h);
  }
  cx.lineTo(W,H);
  cx.fill();

  cx.fillStyle = "#101a2c";
  cx.beginPath();
  cx.moveTo(0,H);
  for(var x2=0;x2<=W;x2+=70){
    var h2 = H*0.55 + Math.sin(x2*0.012+1)*H*0.1;
    cx.lineTo(x2,h2);
  }
  cx.lineTo(W,H);
  cx.fill();

  var gg = cx.createLinearGradient(0,H*0.72,0,H);
  gg.addColorStop(0,"#9fb3d3");
  gg.addColorStop(1,"#2e3d5a");
  cx.fillStyle = gg;
  cx.fillRect(0,H*0.72,W,H*0.28);
}

function drawStars(t){
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var tw = Math.sin(t*s.spd + s.ph);
    var alpha = s.a * (0.4 + 0.6*tw);
    cx.beginPath();
    cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    cx.fillStyle = "rgba(255,255,255,"+alpha+")";
    cx.fill();
  }
}

function drawSnow(t){
  if(!showSnow) return;
  for(var i=0;i<flakes.length;i++){
    var f = flakes[i];
    f.y += f.vy;
    f.x += f.vx + Math.sin(t*0.0015+f.ph)*0.2;
    if(f.y > H+10){ f.y = -10; f.x = Math.random()*W; }
    if(f.x > W+10) f.x = -10;
    if(f.x < -10) f.x = W+10;
    var g = cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,"rgba(255,255,255,0.9)");
    g.addColorStop(0.6,"rgba(255,255,255,0.4)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    cx.beginPath();
    cx.arc(f.x,f.y,f.r,0,Math.PI*2);
    cx.fillStyle = g;
    cx.fill();
  }
}

function loop(t){
  drawScene();
  drawMountains();
  drawStars(t);
  drawSnow(t);
  requestAnimationFrame(loop);
}

// ========== 天气逻辑 ==========
function classify(p){
  if(demo) return "snow";
  if(p.snowing) return "snow";
  if(p.sleet) return "sleet";
  return "none";
}

function loadWeather(){
  var lats = SCENES.map(function(s){return s.lat}).join(",");
  var lons = SCENES.map(function(s){return s.lon}).join(",");
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+lats+"&longitude="+lons+
    "&current=weather_code,temperature_2m,wind_speed_10m&hourly=snowfall,weather_code&forecast_days=2&timezone=UTC";

  fetch(url).then(function(r){return r.json()}).then(function(data){
    var arr = Array.isArray(data) ? data : [data];
    order = SCENES.map(function(s,i){
      var r = arr[i] || {};
      var c = r.current || {};
      var code = c.weather_code;
      var snowing = SNOW_CODES.indexOf(code) > -1;
      var sleet = SLEET_CODES.indexOf(code) > -1;
      return {
        scene: s,
        temp: c.temperature_2m != null ? Math.round(c.temperature_2m*10)/10 : null,
        wind: c.wind_speed_10m != null ? Math.round(c.wind_speed_10m) : null,
        snowing: snowing,
        sleet: sleet,
        mm: 0,
        st: null
      };
    });
    order.forEach(function(o){ o.st = classify(o); });
    buildSheet();
    pickDefault();
  }).catch(function(e){
    order = SCENES.map(function(s,i){
      return {
        scene: s,
        temp: -5 + Math.random()*10,
        wind: 5 + Math.random()*10,
        snowing: s.id === "longyearbyen",
        sleet: false,
        mm: s.id === "longyearbyen" ? 3.2 : 0,
        st: null
      };
    });
    order.forEach(function(o){ o.st = classify(o); });
    buildSheet();
    pickDefault();
  });
}

function pickDefault(){
  var best = 0;
  for(var i=0;i<order.length;i++){
    if(order[i].st === "snow"){ best = i; break; }
  }
  selectCity(best);
}

function selectCity(i){
  curIdx = i;
  var m = order[i];
  if(!m) return;
  buildFlakes(m.st === "snow" || m.st === "sleet");

  document.getElementById("pcn").textContent = m.scene.name;
  document.getElementById("prg").textContent = m.scene.rg;

  var dot = document.getElementById("pdot");
  if(m.st === "snow" || m.st === "sleet"){
    dot.className = "dot";
    document.getElementById("ptxt").textContent = m.scene.name + " · 下雪";
  } else {
    dot.className = "dot off";
    document.getElementById("ptxt").textContent = m.scene.name;
  }

  document.getElementById("wtemp").textContent = m.temp != null ? m.temp + "°" : "—";
  document.getElementById("wcond").textContent = m.st === "snow" ? "下雪" : (m.st === "sleet" ? "雨夹雪" : "无降雪");
  document.getElementById("wwind").textContent = m.wind != null ? m.wind + " m/s" : "—";
  document.getElementById("wsnow").textContent = m.mm > 0 ? m.mm + " cm" : "—";
  document.getElementById("wstate").textContent = m.st === "snow" ? "正在下雪" : (m.st === "sleet" ? "雨夹雪" : "无降雪");
}

function buildSheet(){
  var snow = [], none = [];
  order.forEach(function(m,i){
    if(m.st === "snow" || m.st === "sleet") snow.push([m,i]);
    else none.push([m,i]);
  });

  function rows(list, cls){
    return list.map(function(x){
      var m = x[0], i = x[1];
      var t = m.temp != null ? m.temp + "°" : "";
      return '<button class="item'+(i===curIdx?" cur":"")+(m.st==="none"?" dim":"")+'" data-i="'+i+'">'+
        '<span><span class="nm">'+m.scene.name+'</span><span class="rg">'+m.scene.rg+'</span></span>'+
        '<span class="rt"><span>'+t+'</span><span class="sd '+cls+'"></span></span>'+
      '</button>';
    }).join("");
  }

  var html = "";
  if(snow.length) html += '<div class="grp">正在下雪 · '+snow.length+'</div>' + rows(snow,"");
  if(none.length) html += '<div class="grp">暂无降雪 · '+none.length+'</div>' + rows(none,"none");
  document.getElementById("sbody").innerHTML = html;

  document.getElementById("sfoot").innerHTML =
    '<button class="demo" id="demoBtn"><span>演示：全部地点下雪</span><span class="toggle'+(demo?" on":"")+'" id="tog"></span></button>';

  var items = document.querySelectorAll(".item");
  for(var j=0;j<items.length;j++){
    items[j].addEventListener("click", function(){
      selectCity(parseInt(this.getAttribute("data-i")));
      closeSheet();
    });
  }
  document.getElementById("demoBtn").addEventListener("click", function(){
    demo = !demo;
    order.forEach(function(o){ o.st = classify(o); });
    buildSheet();
    selectCity(curIdx);
  });
}

// ========== UI 交互 ==========
var sheet = document.getElementById("sheet");
var mask = document.getElementById("mask");
document.getElementById("pill").addEventListener("click", function(){
  sheet.classList.toggle("open");
  mask.classList.toggle("open");
});
mask.addEventListener("click", closeSheet);
function closeSheet(){
  sheet.classList.remove("open");
  mask.classList.remove("open");
}

var wxcard = document.getElementById("wxcard");
document.getElementById("wxbtn").addEventListener("click", function(){
  weatherOpen = !weatherOpen;
  wxcard.classList.toggle("open", weatherOpen);
  this.classList.toggle("on", weatherOpen);
});

// ========== 启动 ==========
resize();
requestAnimationFrame(loop);
loadWeather();
setInterval(loadWeather, 20*60*1000);
</script>

</body>
</html>
