<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SnowDay 雪景</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#080812;color:#fff;font-family:system-ui}
#tip{position:fixed;top:16px;left:16px;background:rgba(0,0,0,0.55);padding:6px 10px;border-radius:6px;font-size:14px;z-index:10}
canvas{display:block}
</style>
</head>
<body>
<div id="tip">加载雪景...</div>

<script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/three.js/r160/three.min.js"></script>
<script>
const proxyBase = "https://snow-meteo-proxy.vercel.app/api/proxy-meteo";
let scene,camera,renderer,snowList=[];
let weatherOk = false;

function init3D(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75,window.innerWidth / window.innerHeight,0.1,2000);
  camera.position.z = 80;

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 雪花
  const snowGeo = new THREE.BufferGeometry();
  const snowCount = 1200;
  const pos = new Float32Array(snowCount * 3);
  for(let i=0;i<snowCount;i++){
    pos[i*3] = (Math.random()-0.5)*200;
    pos[i*3+1] = Math.random()*120;
    pos[i*3+2] = (Math.random()-0.5)*200;
  }
  snowGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const snowMat = new THREE.PointsMaterial({color:0xffffff,size:0.7,transparent:true,opacity:0.7});
  const snowMesh = new THREE.Points(snowGeo,snowMat);
  scene.add(snowMesh);
  snowList.push(snowMesh);

  window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  })
  document.getElementById("tip").innerText = "雪景就绪，正在获取天气...";
  animate();
}

async function fetchWeather(){
  try{
    const url = `${proxyBase}?latitude=48.42&longitude=87.42&current=weather_code`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("接口返回异常");
    const data = await res.json();
    weatherOk = true;
    document.getElementById("tip").innerText = "✅ 天气已加载";
  }catch(e){
    document.getElementById("tip").innerText = "⚠️ 天气加载失败，使用模拟降雪";
    console.error(e);
  }
}

function animate(){
  requestAnimationFrame(animate);
  snowList.forEach(mesh=>{
    const arr = mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i++){
      if(i%3===1){
        arr[i] -= 0.15;
        if(arr[i] < -10) arr[i] = 120;
      }
    }
    mesh.geometry.attributes.position.needsUpdate = true;
  })
  renderer.render(scene,camera);
}

(async ()=>{
  init3D();
  await fetchWeather();
})();
</script>
</body>
</html>
