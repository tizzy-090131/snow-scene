<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>全球雪景</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke='%23f2f4f6' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M12 2.5v19M4 7.2l16 9.6M4 16.8l16-9.6'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --white:#F4F6F8;
  --gray:#8A9099;
  --gray-2:#4C525A;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.07);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;height:100%;background:#000;color:var(--white);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid rgba(255,255,255,.6);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;background:#000;z-index:1;}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;}
.vig{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(118% 92% at 50% 46%, rgba(0,0,0,0) 38%, rgba(2,6,12,.36) 76%, rgba(2,5,10,.66) 100%),
    linear-gradient(180deg, rgba(2,6,12,.30) 0%, rgba(0,0,0,0) 26%);
}

.glass{
  background:linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.055) 46%, rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.45);
}

.pill{
  position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;
  height:42px;padding:0 14px 0 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:9px;
  z-index:60;
  transition:transform .3s var(--ease);
}
.pill:active{transform:scale(.97)}
.pill .dot{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);
  box-shadow:0 0 10px rgba(255,255,255,.75);flex:none;
}
.pill .dot.off{background:rgba(255,255,255,.28);box-shadow:none}
.pill .dot.warn{background:rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.4)}
.pill .dot.err{background:#ff6b6b;box-shadow:0 0 8px rgba(255,107,107,.5)}
.pill .txt{
  font-size:13px;letter-spacing:.06em;white-space:nowrap;color:rgba(255,255,255,.94);
}
.pill .chev{width:11px;height:11px;opacity:.6;flex:none;display:block}
.pill .chev svg{width:11px;height:11px;display:block}

.place{
  position:fixed;left:22px;bottom:calc(28px + env(safe-area-inset-bottom));
  z-index:58;pointer-events:none;
  transition:opacity .4s var(--ease);
}
.place .cn{
  display:block;font-weight:300;
  font-size:29px;letter-spacing:.16em;line-height:1.2;
  text-shadow:0 2px 22px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place .meta{
  display:block;margin-top:5px;
  font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);
  text-shadow:0 1px 14px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place.quiet .cn,.place.quiet .meta{opacity:.42}

.wx-btn{
  position:fixed;right:16px;bottom:calc(28px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;z-index:65;
  background:rgba(255,255,255,0.22);
  border:1px solid rgba(255,255,255,0.38);
  box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s var(--ease),background .25s var(--ease);
  cursor:pointer;
}
.wx-btn:hover{background:rgba(255,255,255,0.32);}
.wx-btn:active{transform:scale(.94)}
.wx-btn svg{width:24px;height:24px;stroke:rgba(255,255,255,.95);fill:none;stroke-width:1.7;filter:drop-shadow(0 0 6px rgba(255,255,255,.4));}
.wx-btn.on{background:rgba(74,158,255,.38);border-color:rgba(140,200,255,.6)}

.wx{
  position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));
  width:240px;border-radius:18px;padding:14px 16px 15px;
  z-index:64;transform-origin:100% 100%;
  transform:translateY(8px) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .26s var(--ease),transform .32s var(--ease);
}
.wx.open{opacity:1;transform:none;pointer-events:auto}
.wx .wtitle{
  font-size:10px;letter-spacing:.22em;color:var(--gray);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.wx .wbig{margin-top:9px;display:flex;align-items:baseline;gap:8px}
.wx .wbig .t{font-size:32px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wx .wbig .s{font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.72)}
.wx .wrows{margin-top:12px;display:grid;gap:7px}
.wx .wr{
  display:flex;justify-content:space-between;gap:10px;
  font-size:11.5px;color:var(--gray);letter-spacing:.04em;
  border-top:1px solid var(--line-soft);padding-top:7px;
}
.wx .wr b{font-weight:400;color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}

.sheet-mask{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .32s var(--ease);
}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  max-height:74vh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;
  background:linear-gradient(180deg, rgba(26,28,33,.88) 0%, rgba(11,12,15,.94) 100%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  backdrop-filter:blur(28px) saturate(170%);
  border-top:1px solid rgba(255,255,255,.14);
  box-shadow:0 -18px 50px rgba(0,0,0,.55);
  transform:translateY(101%);
  transition:transform .42s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{transform:none}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;flex:none;
}
.sheet-head .h{font-size:11px;letter-spacing:.24em;color:var(--gray)}
.sheet-head .n{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 8px}
.sheet-foot{flex:none;padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.grp{font-size:10px;letter-spacing:.22em;color:var(--gray-2);padding:14px 10px 6px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:56px;padding:10px 12px;border-radius:14px;
  text-align:left;transition:background .2s;
}
.row:active{background:rgba(255,255,255,.09)}
.row:hover{background:rgba(255,255,255,.05)}
.row .nm{font-size:14.5px;letter-spacing:.08em;line-height:1.35}
.row .rg{display:block;font-size:10px;letter-spacing:.16em;color:var(--gray-2);margin-top:2px}
.row .rt{
  margin-left:auto;font-size:12px;color:rgba(255,255,255,.72);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;
}
.row .sd{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.8)}
.row .sd.soon{background:rgba(255,255,255,.4);box-shadow:none}
.row .sd.none{background:rgba(255,255,255,.16);box-shadow:none}
.row .sd.err{background:#ff6b6b;box-shadow:none}
.row.dim .nm{color:rgba(255,255,255,.55)}
.row.cur{background:rgba(255,255,255,.07)}
.grabber{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:8px auto -2px;flex:none}
.demo-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:4px 10px 8px;padding:12px;border-radius:14px;
  border:1px solid var(--line-soft);width:calc(100% - 20px);
}
.demo-row span{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.7)}
.toggle{
  width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);
  position:relative;flex:none;transition:background .25s;
}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.9);transition:transform .3s var(--ease);
}
.toggle[aria-checked="true"]{background:rgba(255,255,255,.55)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}

@media (min-width:768px){
  .pill{top:22px;left:24px;height:44px}
  .place{left:30px;bottom:34px}
  .place .cn{font-size:33px}
  .wx-btn{right:24px;bottom:34px}
  .wx{right:24px;bottom:92px}
  .sheet{left:auto;right:20px;bottom:20px;width:368px;border-radius:20px;
    max-height:74vh;transform:translateY(14px) scale(.97);opacity:0;
    transition:opacity .26s var(--ease),transform .3s var(--ease);
    border:1px solid rgba(255,255,255,.14);}
  .sheet.open{transform:none;opacity:1}
  .sheet-mask{background:rgba(0,0,0,.26)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important;animation-duration:.01s!important}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <div class="vig"></div>

  <button class="pill glass" id="pill" aria-label="选择地点" aria-expanded="false">
    <span class="dot warn" id="pillDot"></span>
    <span class="txt" id="pillTxt">加载中</span>
    <span class="chev" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.6"><path d="M6 9l6 6 6-6" /></svg>
    </span>
  </button>

  <div class="place" id="place">
    <span class="cn" id="placeCn">—</span>
    <span class="meta" id="placeMeta"></span>
  </div>

  <button class="wx-btn glass" id="wxBtn" aria-label="查看天气" aria-expanded="false">
    <svg viewBox="0 0 24 24" stroke-linecap="round">
      <path d="M12 2v10a4 4 0 1 0 0 8 4 4 0 0 0 0-8V2" fill="none"></path>
      <circle cx="12" cy="14" r="4"></circle>
    </svg>
  </button>

  <div class="wx glass" id="wxCard" role="dialog" aria-label="天气详情">
    <div class="wtitle"><span>此刻</span><span id="wxPlace"></span></div>
    <div class="wbig"><span class="t" id="wxTemp">—</span><span class="s" id="wxCond">—</span></div>
    <div class="wrows" id="wxRows"></div>
  </div>
</div>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="选择地点">
  <div class="grabber"></div>
  <div class="sheet-head">
    <span class="h">选择地点</span>
    <span class="n" id="sheetCount"></span>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<script>
// 【关键修复：用美国节点，国内能直接访问】
const API_BASE = "https://api-us.open-meteo.com";

const SCENES = [
  {id:"altay",name:"阿勒泰",region:"中国·新疆",lat:47.85,lon:88.12},
  {id:"changbai",name:"长白山",region:"中国·吉林",lat:42.00,lon:128.06},
  {id:"shangri-la",name:"香格里拉",region:"中国·云南",lat:27.83,lon:99.70},
  {id:"lhasa",name:"念青唐古拉山",region:"中国·西藏",lat:29.66,lon:91.12},
  {id:"hulunbuir",name:"呼伦贝尔雪原",region:"中国·内蒙古",lat:49.22,lon:119.75},
  {id:"tianshan",name:"天山",region:"中国·新疆",lat:43.79,lon:87.62},
  {id:"qilian",name:"祁连山",region:"中国·青海",lat:39.58,lon:98.42},
  {id:"gongga",name:"贡嘎雪山",region:"中国·四川",lat:29.59,lon:101.88},
  {id:"k2",name:"乔戈里峰",region:"中国·新疆",lat:35.88,lon:76.51},
  {id:"meili",name:"梅里雪山",region:"中国·云南",lat:28.45,lon:98.88},
  {id:"daocheng",name:"稻城亚丁",region:"中国·四川",lat:28.50,lon:100.30},
  {id:"helan",name:"贺兰山",region:"中国·宁夏",lat:38.85,lon:105.92},
  {id:"fuji",name:"富士山",region:"日本·静冈县",lat:35.36,lon:138.73},
  {id:"sapporo",name:"札幌雪原",region:"日本·北海道",lat:43.06,lon:141.35},
  {id:"matterhorn",name:"马特洪峰",region:"瑞士·采尔马特",lat:45.98,lon:7.66},
  {id:"jungfrau",name:"少女峰",region:"瑞士·伯尔尼",lat:46.55,lon:7.98},
  {id:"rovaniemi",name:"罗瓦涅米",region:"芬兰·拉普兰",lat:66.50,lon:25.73},
  {id:"longyearbyen",name:"朗伊尔城",region:"挪威·斯瓦尔巴",lat:78.22,lon:15.62},
  {id:"tromso",name:"特罗姆瑟",region:"挪威",lat:69.65,lon:18.96},
  {id:"banff",name:"班夫落基山",region:"加拿大",lat:51.18,lon:-115.57},
  {id:"whistler",name:"惠斯勒雪山",region:"加拿大",lat:50.11,lon:-122.95},
  {id:"denali",name:"迪纳利山",region:"美国·阿拉斯加",lat:63.07,lon:-151.01},
  {id:"mtrainier",name:"雷尼尔山",region:"美国",lat:46.85,lon:-121.76},
  {id:"patagonia",name:"巴塔哥尼亚",region:"阿根廷",lat:-49.22,lon:-73.03},
  {id:"kilimanjaro",name:"乞力马扎罗",region:"坦桑尼亚",lat:-3.07,lon:37.35},
  {id:"aoraki",name:"奥拉基库克山",region:"新西兰",lat:-43.53,lon:170.14},
  {id:"montblanc",name:"勃朗峰",region:"法国阿尔卑斯",lat:45.83,lon:6.86},
  {id:"grossglockner",name:"大格洛克纳山",region:"奥地利",lat:47.07,lon:12.75}
];

const SNOW_CODES = [71,73,75,77,85,86];
const SLEET_CODES = [66,67,68,79];
const CACHE_KEY = "snowday.v5.cache";
const CACHE_MIN = 20;
const MAX_RETRY = 2;
let mv = { list: [], cur: 0, demo: false };
function byId(id){ return document.getElementById(id); }

async function fetchOneWithRetry(scene, retry=0){
  const url = `${API_BASE}/v1/forecast?latitude=${scene.lat}&longitude=${scene.lon}&current=temperature_2m,weather_code,snowfall,wind_speed_10m&hourly=snowfall,weather_code&forecast_days=2&timezone=UTC`;
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if(!res.ok) throw new Error("http " + res.status);
    const j = await res.json();
    const cur = j.current || {};
    const hourly = j.hourly || {};
    const times = hourly.time || [];
    const hCode = hourly.weather_code || [];
    const hSnow = hourly.snowfall || [];
    let nextSnow = null;
    let sumSnow = 0;
    const nowTs = Date.now();
    for(let k=0;k<times.length;k++){
      const t = new Date(times[k] + (times[k].length>16 ? "" : "Z")).getTime();
      if(t < nowTs - 3600e3) continue;
      if(t > nowTs + 24*3600e3) break;
      if(SNOW_CODES.includes(hCode[k]) || SLEET_CODES.includes(hCode[k])){
        sumSnow += Number(hSnow[k] || 0);
        if(!nextSnow) nextSnow = new Date(t).toISOString();
      }
    }
    return {
      id: scene.id, ok: true,
      temp: cur.temperature_2m, wind: cur.wind_speed_10m, code: cur.weather_code,
      snowNow: SNOW_CODES.includes(cur.weather_code), sleetNow: SLEET_CODES.includes(cur.weather_code),
      snow24h: sumSnow, nextSnow
    };
  } catch(err){
    if(retry < MAX_RETRY){
      await new Promise(r=>setTimeout(r, 600));
      return fetchOneWithRetry(scene, retry + 1);
    }
    return { id: scene.id, ok: false, err: err.message };
  }
}

function classifyStatus(item){
  if(mv.demo) return "snow";
  if(!item.ok) return "error";
  if(item.snowNow) return "snow";
  if(item.sleetNow) return "sleet";
  if(item.nextSnow) return "soon";
  return "none";
}
function formatTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

async function loadAll(){
  byId("pillTxt").textContent = "正在获取天气…";
  byId("pillDot").className = "dot warn";
  const cachedRaw = localStorage.getItem(CACHE_KEY);
  let cached = null;
  try { cached = JSON.parse(cachedRaw); } catch(e){}
  if(cached && cached.ts && Date.now() - cached.ts < CACHE_MIN*60000 && cached.data){
    mv.list = cached.data;
    buildUI();
    byId("pillTxt").textContent = "使用缓存天气";
    byId("pillDot").className = "dot";
    return;
  }
  mv.list = [];
  for(const s of SCENES){
    const w = await fetchOneWithRetry(s);
    mv.list.push({ scene: s, weather: w });
    buildUI();
  }
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: mv.list })); } catch(e){}
  const failCount = mv.list.filter(x=>!x.weather.ok).length;
  if(failCount > 0){
    byId("pillTxt").textContent = `${failCount}个地点获取失败`;
    byId("pillDot").className = "dot err";
  }else{
    byId("pillTxt").textContent = "天气已更新";
    byId("pillDot").className = "dot";
  }
}

function buildUI(){
  buildSheet();
  setPlace(mv.cur, true);
}
function setPlace(idx, instant){
  if(idx < 0 || idx >= mv.list.length) return;
  mv.cur = idx;
  const entry = mv.list[idx];
  const status = classifyStatus(entry.weather);
  window.drawScene(entry.scene.id, status);
  byId("placeCn").textContent = entry.scene.name;
  byId("placeMeta").textContent = entry.scene.region;
  byId("place").classList.toggle("quiet", !(status === "snow" || status === "sleet"));
  fillWeatherPanel(entry, status);
}
function fillWeatherPanel(entry, status){
  const w = entry.weather;
  byId("wxPlace").textContent = entry.scene.name;
  if(!w.ok){
    byId("wxTemp").textContent = "—";
    byId("wxCond").textContent = "获取失败";
    byId("wxRows").innerHTML = `<div class="wr"><span>提示</span><b>网络异常，可开演示下雪</b></div>`;
    return;
  }
  byId("wxTemp").textContent = (w.temp != null ? w.temp + "°" : "—");
  let condText = "无降雪";
  if(status === "snow") condText = mv.demo ? "演示降雪" : "正在下雪";
  else if(status === "sleet") condText = "雨夹雪";
  else if(status === "soon") condText = "即将下雪";
  byId("wxCond").textContent = condText;
  const rows = [
    ["风速", w.wind != null ? w.wind + " km/h" : "—"],
    ["未来24h降雪", w.snow24h != null ? w.snow24h.toFixed(1) + " cm" : "—"],
    ["预计开始", w.nextSnow ? formatTime(w.nextSnow) : "—"],
    ["状态", condText]
  ];
  byId("wxRows").innerHTML = rows.map(r => `<div class="wr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
}

function buildSheet(){
  const groups = { snow:[], sleet:[], soon:[], none:[], error:[] };
  mv.list.forEach((item, i) => {
    const st = classifyStatus(item.weather);
    if(groups[st]) groups[st].push({item,i});
    else groups.none.push({item,i});
  });
  function renderGroup(title, arr, dotClass){
    if(!arr.length) return "";
    let html = `<div class="grp">${title} · ${arr.length}</div>`;
    arr.forEach(({item,i}) => {
      const w = item.weather;
      const tempText = w.ok && w.temp != null ? w.temp + "°" : "";
      html += `
        <button class="row ${i === mv.cur ? "cur" : ""} ${(classifyStatus(w) === "none") ? "dim" : ""}" data-i="${i}">
          <span>
            <span class="nm">${item.scene.name}</span>
            <span class="rg">${item.scene.region}</span>
          </span>
          <span class="rt">
            <span>${tempText}</span>
            <span class="sd ${dotClass}"></span>
          </span>
        </button>
      `;
    });
    return html;
  }
  const body = renderGroup("正在下雪", groups.snow, "")
    + renderGroup("雨夹雪", groups.sleet, "")
    + renderGroup("即将下雪", groups.soon, "soon")
    + renderGroup("暂无降雪", groups.none, "none")
    + renderGroup("获取失败", groups.error, "err");
  byId("sheetBody").innerHTML = body;
  byId("sheetCount").textContent = mv.list.length + " 个地点";
  byId("sheetFoot").innerHTML = `
    <div class="demo-row" id="demoRow">
      <span>演示：全部地点开启下雪</span>
      <span class="toggle" role="switch" aria-checked="${mv.demo ? "true" : "false"}" id="demoTog"></span>
    </div>
  `;
  byId("sheetBody").querySelectorAll(".row").forEach(btn => {
    btn.onclick = () => { setPlace(Number(btn.dataset.i), false); closeSheet(); };
  });
  byId("demoRow").onclick = () => {
    mv.demo = !mv.demo;
    byId("demoTog").setAttribute("aria-checked", mv.demo ? "true" : "false");
    buildUI();
  };
}
function openSheet(){ buildSheet(); byId("sheet").classList.add("open"); byId("mask").classList.add("open"); byId("pill").setAttribute("aria-expanded", "true"); }
function closeSheet(){ byId("sheet").classList.remove("open"); byId("mask").classList.remove("open"); byId("pill").setAttribute("aria-expanded", "false"); }
byId("pill").onclick = () => { if(byId("sheet").classList.contains("open")) closeSheet(); else openSheet(); };
byId("mask").onclick = closeSheet;
byId("wxBtn").onclick = () => {
  const card = byId("wxCard");
  const btn = byId("wxBtn");
  const open = card.classList.toggle("open");
  btn.classList.toggle("on", open);
  btn.setAttribute("aria-expanded", open ? "true" : "false");
};

const canvas = byId("bgCanvas");
const ctx = canvas.getContext("2d");
let W, H;
let stars = [];
let snowList = [];
let showSnow = false;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  createStars();
}
window.addEventListener("resize", resize);
function createStars(){
  stars = [];
  const count = Math.floor((W * H) / 1300);
  for(let i = 0; i < count; i++){
    stars.push({
      x: Math.random() * W, y: Math.random() * H * 0.75,
      r: Math.random() * 1.1 + 0.25, baseA: Math.random() * 0.5 + 0.2,
      spd: Math.random() * 0.0022 + 0.0006, phase: Math.random() * Math.PI * 2
    });
  }
}
function resetSnow(enable){
  showSnow = enable; snowList = [];
  if(!enable) return;
  const cnt = 450;
  for(let i = 0; i < cnt; i++){
    snowList.push({
      x: Math.random() * W, y: Math.random() * -H,
      r: Math.random() * 2.2 + 0.6, ys: Math.random() * 1.2 + 0.7,
      xDrift: Math.random() * 0.4 - 0.2, phase: Math.random() * Math.PI * 2
    });
  }
}
function drawBackground(){
  const gradSky = ctx.createLinearGradient(0,0,0,H);
  gradSky.addColorStop(0,"#070e20");
  gradSky.addColorStop(0.45,"#122444");
  gradSky.addColorStop(1,"#203860");
  ctx.fillStyle = gradSky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#141f33";
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x = 0; x <= W; x += 120){
    const h = H * 0.38 + Math.sin(x * 0.007) * H * 0.16 + Math.cos(x * 0.013) * H * 0.08;
    ctx.lineTo(x, h);
  }
  ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = "#0f1726";
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x = 0; x <= W; x += 80){
    const h = H * 0.55 + Math.sin(x * 0.011) * H * 0.11;
    ctx.lineTo(x, h);
  }
  ctx.lineTo(W, H); ctx.fill();
  const gradGround = ctx.createLinearGradient(0, H * 0.72, 0, H);
  gradGround.addColorStop(0, "#a0b4d4");
  gradGround.addColorStop(1, "#354460");
  ctx.fillStyle = gradGround; ctx.fillRect(0, H * 0.72, W, H * 0.28);
}
function render(time){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  for(const s of stars){
    const tw = Math.sin(time * s.spd + s.phase);
    const alpha = s.baseA * (0.4 + 0.6 * tw);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill();
  }
  if(showSnow){
    for(const f of snowList){
      f.y += f.ys;
      f.x += f.xDrift + Math.sin(time * 0.0015 + f.phase) * 0.22;
      if(f.y > H + 10){ f.y = -10; f.x = Math.random() * W; }
      if(f.x > W + 10) f.x = -10;
      if(f.x < -10) f.x = W + 10;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, "rgba(255,255,255,0.92)");
      g.addColorStop(0.6, "rgba(255,255,255,0.45)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
    }
  }
  requestAnimationFrame(render);
}
window.drawScene = function(id, status){ resetSnow(status === "snow" || status === "sleet"); };
resize(); requestAnimationFrame(render);
loadAll();
setInterval(loadAll, CACHE_MIN * 60000);
</script>
