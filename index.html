<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>今日雪</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke='%23f2f4f6' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M12 2.5v19M4 7.2l16 9.6M4 16.8l16-9.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@200;300;400&amp;display=swap">
<style>
:root{
  --white:#F4F6F8;
  --gray:#8A9099;
  --gray-2:#4C525A;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.07);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;height:100%;background:#000;color:var(--white);
  font-family:var(--sans);overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid rgba(255,255,255,.6);outline-offset:3px}

/* ===== 舞台 ===== */
#stage{position:fixed;inset:0;overflow:hidden;background:#000}

.bg{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(112% 64% at 50% 86%, rgba(255,255,255,.15) 0%, rgba(255,255,255,.055) 38%, rgba(0,0,0,0) 74%),
    radial-gradient(64% 34% at 50% 99%, rgba(255,255,255,.13) 0%, rgba(0,0,0,0) 72%),
    #000;
}
.scene-svg{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;
  opacity:1;transition:opacity .45s var(--ease);
}
.scene-svg svg{width:100%;height:100%;display:block;overflow:visible}
.scene-svg .mass{fill:#040507}
.scene-svg .mass-back{fill:#090B0E}
.scene-svg .ground{fill:#050607}
.scene-svg .hair{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1.3;stroke-linecap:round}
.scene-svg .snowline{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1.6}
.glow{position:absolute;left:0;right:0;bottom:0;height:15%;pointer-events:none;
  background:radial-gradient(72% 100% at 50% 100%, rgba(255,255,255,.17) 0%, rgba(255,255,255,.05) 52%, rgba(0,0,0,0) 78%);
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.vig{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(118% 92% at 50% 46%, rgba(0,0,0,0) 38%, rgba(2,6,12,.36) 76%, rgba(2,5,10,.66) 100%),
    linear-gradient(180deg, rgba(2,6,12,.30) 0%, rgba(0,0,0,0) 26%);
}
#gl:active{cursor:grabbing}

/* ===== 液态玻璃 ===== */
.glass{
  background:linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.055) 46%, rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.45);
}

/* ===== 左上角胶囊 ===== */
.pill{
  position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;
  height:42px;padding:0 14px 0 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:9px;
  z-index:30;
  transition:transform .3s var(--ease);
}
.pill:active{transform:scale(.97)}
.pill .dot{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);
  box-shadow:0 0 10px rgba(255,255,255,.75);flex:none;
}
.pill .dot.off{background:rgba(255,255,255,.28);box-shadow:none}
.pill .dot.warn{background:rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.4)}
.pill .txt{
  font-size:13px;letter-spacing:.06em;white-space:nowrap;color:rgba(255,255,255,.94);
}
.pill .chev{width:11px;height:11px;opacity:.6;flex:none;display:block}
.pill .chev svg{width:11px;height:11px;display:block}

/* ===== 地点名 ===== */
.place{
  position:absolute;left:22px;bottom:calc(28px + env(safe-area-inset-bottom));
  z-index:20;pointer-events:none;
  transition:opacity .4s var(--ease);
}
.place .cn{
  display:block;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:300;
  font-size:29px;letter-spacing:.16em;line-height:1.2;
  text-shadow:0 2px 22px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place .meta{
  display:block;margin-top:5px;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:300;
  font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);
  text-shadow:0 1px 14px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place.quiet .cn,.place.quiet .meta{opacity:.42}

/* ===== 天气按钮 + 卡片 ===== */
.wx-btn{
  position:absolute;right:16px;bottom:calc(28px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;z-index:30;
  transition:transform .3s var(--ease);
}
.wx-btn:active{transform:scale(.94)}
.wx-btn svg{width:18px;height:18px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:1.5}
.wx-btn.on{background:linear-gradient(180deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.10) 100%)}

.wx{
  position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
  width:218px;border-radius:18px;padding:14px 16px 15px;
  z-index:29;transform-origin:100% 100%;
  transform:translateY(6px) scale(.94);opacity:0;pointer-events:none;
  transition:opacity .26s var(--ease),transform .32s var(--ease);
}
.wx.open{opacity:1;transform:none;pointer-events:auto}
.wx .wtitle{
  font-size:10px;letter-spacing:.22em;color:var(--gray);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.wx .wbig{margin-top:9px;display:flex;align-items:baseline;gap:8px}
.wx .wbig .t{font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wx .wbig .s{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.72)}
.wx .wrows{margin-top:12px;display:grid;gap:7px}
.wx .wr{
  display:flex;justify-content:space-between;gap:10px;
  font-size:11.5px;color:var(--gray);letter-spacing:.04em;
  border-top:1px solid var(--line-soft);padding-top:7px;
}
.wx .wr b{font-weight:400;color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}

/* ===== 选择面板 ===== */
.sheet-mask{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .32s var(--ease);
}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-height:74vh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;
  background:linear-gradient(180deg, rgba(26,28,33,.88) 0%, rgba(11,12,15,.94) 100%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  backdrop-filter:blur(28px) saturate(170%);
  border-top:1px solid rgba(255,255,255,.14);
  box-shadow:0 -18px 50px rgba(0,0,0,.55);
  transform:translateY(101%);
  transition:transform .42s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
  pointer-events:none;
}
.sheet.open{transform:none;pointer-events:auto}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;flex:none;
}
.sheet-head .h{font-size:11px;letter-spacing:.24em;color:var(--gray)}
.sheet-head .n{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 8px}
.sheet-foot{flex:none;padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.grp{font-size:10px;letter-spacing:.22em;color:var(--gray-2);padding:14px 10px 6px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:56px;padding:10px 12px;border-radius:14px;
  text-align:left;transition:background .2s;
}
.row:active{background:rgba(255,255,255,.09)}
.row:hover{background:rgba(255,255,255,.05)}
.row .nm{font-size:14.5px;letter-spacing:.08em;line-height:1.35}
.row .rg{display:block;font-size:10px;letter-spacing:.16em;color:var(--gray-2);margin-top:2px}
.row .rt{
  margin-left:auto;font-size:12px;color:rgba(255,255,255,.72);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;
}
.row .sd{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.8)}
.row .sd.soon{background:rgba(255,255,255,.4);box-shadow:none}
.row .sd.none{background:rgba(255,255,255,.16);box-shadow:none}
.row.dim .nm{color:rgba(255,255,255,.55)}
.row.cur{background:rgba(255,255,255,.07)}
.grabber{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:8px auto -2px;flex:none}

.demo-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:4px 10px 8px;padding:12px;border-radius:14px;
  border:1px solid var(--line-soft);width:calc(100% - 20px);
}
.demo-row span{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.7)}
.toggle{
  width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);
  position:relative;flex:none;transition:background .25s;
}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.9);transition:transform .3s var(--ease);
}
.toggle[aria-checked="true"]{background:rgba(255,255,255,.55)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}

/* ===== 留言 ===== */
.msg-btn{
  position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;
  height:42px;padding:0 13px 0 11px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;z-index:30;
  transition:transform .3s var(--ease);
}
.msg-btn:active{transform:scale(.97)}
.msg-btn svg{width:15px;height:15px;stroke:rgba(255,255,255,.82);fill:none;stroke-width:1.5;flex:none}
.msg-btn .t{font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.92)}
.msg-btn .n{font-size:11px;letter-spacing:.02em;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}

.msg-card{
  position:absolute;z-index:36;width:min(268px,74vw);
  padding:12px 12px 11px;border-radius:16px;
  opacity:0;pointer-events:none;transform:translate(-50%,-100%) translateY(6px) scale(.96);
  transform-origin:50% 100%;
  transition:opacity .22s var(--ease),transform .3s var(--ease);
}
.msg-card{
  background:linear-gradient(180deg, rgba(24,27,33,.93) 0%, rgba(10,12,16,.95) 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 46px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
}
.msg-card.open{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) scale(1)}
.msg-card .tip{font-size:10px;letter-spacing:.2em;color:var(--gray);margin-bottom:8px}
.msg-card textarea{
  width:100%;height:60px;resize:none;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.06);color:var(--white);font:inherit;font-size:13px;
  line-height:1.5;padding:9px 10px;outline:none;display:block;
}
.msg-card textarea::placeholder{color:rgba(255,255,255,.32)}
.msg-card .acts{display:flex;gap:8px;margin-top:9px}
.msg-card .acts button{flex:1;height:34px;border-radius:10px;font-size:12.5px;letter-spacing:.06em;transition:background .2s}
.msg-card .no{background:rgba(255,255,255,.07);color:rgba(255,255,255,.68);border:1px solid var(--line-soft)}
.msg-card .ok{background:rgba(255,255,255,.9);color:#10141a}
.msg-card .no:active{background:rgba(255,255,255,.13)}
.msg-card .ok:active{background:#fff}

.msg-tabs{display:flex;gap:7px;overflow-x:auto;padding:0 16px 11px;flex:none;scrollbar-width:none}
.msg-tabs::-webkit-scrollbar{display:none}
.msg-tab{
  flex:none;height:30px;padding:0 12px;border-radius:999px;white-space:nowrap;
  font-size:12px;letter-spacing:.05em;color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);
  transition:color .2s,background .2s,border-color .2s;
}
.msg-tab.on{color:#fff;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.26)}
.msg-list{padding:0 12px 12px}
.msg-item{
  display:flex;gap:10px;padding:11px 12px;border-radius:13px;margin-bottom:6px;
  background:rgba(255,255,255,.045);border:1px solid var(--line-soft);
}
.msg-item svg{flex:none;width:13px;height:13px;margin-top:3px;opacity:.55;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.4}
.msg-item .tx{font-size:13px;line-height:1.55;color:rgba(255,255,255,.9);word-break:break-word}
.msg-empty{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.4);padding:30px 12px;text-align:center}
.msg-hint{font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.4);padding:0 16px 12px;text-align:center;min-height:0}

@media (min-width:768px){
  .pill{top:22px;left:24px;height:44px}
  .place{left:30px;bottom:34px}
  .place .cn{font-size:33px}
  .wx-btn{right:24px;bottom:34px}
  .wx{right:24px;bottom:92px}
  .msg-btn{top:22px;right:24px;height:44px}
  .sheet{left:auto;right:20px;bottom:20px;width:368px;border-radius:20px;
    max-height:74vh;transform:translateY(14px) scale(.97);opacity:0;
    transition:opacity .26s var(--ease),transform .3s var(--ease);
    border:1px solid rgba(255,255,255,.14);}
  .sheet.open{transform:none;opacity:1}
  .sheet-mask{background:rgba(0,0,0,.26)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important;animation-duration:.01s!important}
}
</style>
</head>
<body>

<div id="stage">
  <div class="vig"></div>
  <button class="pill glass" id="pill" aria-label="选择地点" aria-expanded="false">
    <span class="dot warn" id="pillDot"></span>
    <span class="txt" id="pillTxt">正在获取降雪…</span>
    <span class="chev" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>
    </span>
  </button>

  <div class="place" id="place">
    <span class="cn" id="placeCn">—</span>
    <span class="meta" id="placeMeta"></span>
  </div>

  <button class="wx-btn glass" id="wxBtn" aria-label="查看天气" aria-expanded="false">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M9.6 13.4V5.4a2.3 2.3 0 014.6 0v8a4.1 4.1 0 11-4.6 0z"/><path d="M11.9 10.2v5.2" opacity=".55"/></svg>
  </button>

  <div class="wx glass" id="wxCard" role="dialog" aria-label="天气详情">
    <div class="wtitle"><span>此刻</span><span id="wxPlace"></span></div>
    <div class="wbig"><span class="t" id="wxTemp">—</span><span class="s" id="wxCond"></span></div>
    <div class="wrows" id="wxRows"></div>
  </div>
  <button class="msg-btn glass" id="msgBtn" aria-label="查看留言" aria-expanded="false">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M4.8 5.9a2.9 2.9 0 012.9-2.9h8.6a2.9 2.9 0 012.9 2.9v6.4a2.9 2.9 0 01-2.9 2.9H9.9l-4 3.2v-3.2"/></svg>
    <span class="t">留言</span><span class="n" id="msgBtnN">0</span>
  </button>

  <div class="msg-card glass" id="msgCard" role="dialog" aria-label="给这片雪留言">
    <div class="tip">给这片雪留一句话</div>
    <textarea id="msgText" maxlength="24" placeholder="幸福如雪慢一点就好了"></textarea>
    <div class="acts">
      <button class="no" id="msgNo" type="button">放走</button>
      <button class="ok" id="msgOk" type="button">确认</button>
    </div>
  </div>
</div>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="选择地点">
  <div class="grabber"></div>
  <div class="sheet-head">
    <span class="h">选择地点</span>
    <span class="n" id="sheetCount"></span>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<div class="sheet-mask" id="msgMask"></div>
<div class="sheet" id="msgPanel" role="dialog" aria-label="大家的留言">
  <div class="grabber"></div>
  <div class="sheet-head">
    <span class="h">大家的留言</span>
    <span class="n" id="msgTotal"></span>
  </div>
  <div class="msg-tabs" id="msgTabs"></div>
  <div class="sheet-body"><div class="msg-list" id="msgList"></div><div class="msg-hint" id="msgHint"></div></div>
</div>

  if(st==='snow') return mv.demo ? '演示降雪' : '正在下雪';
  if(st==='sleet') return '雨夹雪';
  if(st==='soon') return '将下雪';
  return '无雪';
}

/* ===== 数据源一：Open-Meteo（一次取全部坐标） ===== */
function fromOpenMeteo(){
  var lat = SCENES.map(function(s){ return s.lat; }).join(',');
  var lon = SCENES.map(function(s){ return s.lon; }).join(',');
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
            '&current=weather_code,temperature_2m,snowfall,wind_speed_10m'+
            '&hourly=snowfall,weather_code&forecast_days=2&timezone=UTC';
  return getJSON(url, 10000).then(function(j){
    var arr = Array.isArray(j) ? j : [j];
    if(!arr.length) throw new Error('empty');
    return { source:'Open-Meteo', places: arr.map(function(r, i){
      var c = r.current || {};
      var hr = r.hourly || {};
      var times = hr.time || [], sf = hr.snowfall || [], hc = hr.weather_code || [];
      var next = null, sum = 0, t0 = Date.now();
      for(var k=0;k<times.length;k++){
        var tt = new Date(times[k] + (times[k].length>16?'':'Z')).getTime();
        if(tt-t0 < -3600e3) continue;
        if(tt-t0 > 24*3600e3) break;
        if(SNOW_CODES.indexOf(hc[k])>-1 || SLEET_CODES.indexOf(hc[k])>-1){
          sum += (sf[k]||0);
          if(!next) next = new Date(tt).toISOString();
        }
      }
      return {
        id: SCENES[i].id,
        temp: (c.temperature_2m!=null ? Math.round(c.temperature_2m*10)/10 : null),
        wind: (c.wind_speed_10m!=null ? Math.round(c.wind_speed_10m*10)/10 : null),
        code: String(c.weather_code==null?'':c.weather_code),
        snowing: SNOW_CODES.indexOf(c.weather_code)>-1,
        sleet: SLEET_CODES.indexOf(c.weather_code)>-1,
        next: next, mm: Math.round(sum*10)/10
      };
    })};
  });
}

/* ===== 数据源二：MET Norway ===== */
function fromMetNo(){
  var out = [], fail = 0, list = SCENES.slice(), chain = Promise.resolve();
  list.forEach(function(s){
    chain = chain.then(function(){
      return getJSON('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat='+s.lat+'&lon='+s.lon, 9000)
        .then(function(d){
          var ts = d.properties.timeseries;
          var cur = ts[0].data;
          var sym = (cur.next_1_hours && cur.next_1_hours.summary.symbol_code) || '';
          var next = null, sum = 0, t0 = Date.now();
          for(var k=0;k<ts.length && k<40;k++){
            var n = ts[k].data.next_1_hours;
            if(!n) continue;
            var tt = new Date(ts[k].time).getTime();
            if(tt-t0 < -3600e3) continue;
            if(tt-t0 > 24*3600e3) break;
            if(/snow/.test(n.summary.symbol_code)){
              sum += n.details.precipitation_amount || 0;
              if(!next) next = new Date(tt).toISOString();
            }
          }
          out.push({
            id: s.id,
            temp: Math.round(cur.instant.details.air_temperature*10)/10,
            wind: Math.round((cur.instant.details.wind_speed||0)*10)/10,
            code: sym,
            snowing: /snow/.test(sym) && !/sleet/.test(sym),
            sleet: /sleet/.test(sym),
            next: /snow/.test(sym) ? null : next,
            mm: Math.round(sum*10)/10
          });
        })
        .catch(function(){ fail++; })
        .then(function(){ return new Promise(function(r){ setTimeout(r, 200); }); });
    });
  });
  return chain.then(function(){
    if(fail > list.length*0.4) throw new Error('met.no 多数请求失败');
    out.sort(function(a,b){
      return SCENES.findIndex(function(s){return s.id===a.id;}) - SCENES.findIndex(function(s){return s.id===b.id;});
    });
    return { source:'MET Norway', places: out };
  });
}

function loadData(force){
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  if(!force && cached && Date.now()-cached.ts < CACHE_MIN*60e3 && cached.places && cached.places.length===SCENES.length){
    apply(cached.places, cached.source); return;
  }
  setPill('warn', '正在获取降雪…');
  fromOpenMeteo()
    .catch(function(){ return fromMetNo(); })
    .then(function(res){
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), places:res.places, source:res.source})); }catch(e){}
      apply(res.places, res.source);
    })
    .catch(function(){
      apply(FALLBACK, '示例');
    });
}
function apply(places, source){
  mv.source = source;
  mv.order = SCENES.map(function(s){
    var p = null;
    for(var k=0;k<places.length;k++){ if(places[k].id===s.id){ p = places[k]; break; } }
    if(!p) p = {id:s.id, temp:null, next:null, mm:0};
    return { scene:s, place:p, st: classify(p) };
  });
  buildSheet();
  var best = pickDefault();
  if(DEEP){
    for(var d=0;d<mv.order.length;d++){
      if(mv.order[d].scene.id === DEEP){ best = d; break; }
    }
  }
  setPlace(best < 0 ? 0 : best, true);
}

function pickDefault(){
  var iBest = -1, vBest = -1;
  var seed = new Date().toISOString().slice(0,10);
  mv.order.forEach(function(m, i){
    var v = 0;
    if(m.st==='snow') v = 1000 + (m.place.mm||0);
    else if(m.st==='sleet') v = 900 + (m.place.mm||0);
    else if(m.st==='soon') v = 500 - Math.min(400, Math.max(0, (new Date(m.place.next||0)-Date.now())/60e3));
    v += (Math.abs(hash(seed + m.scene.id)) % 1000) / 1000;   /* 同分时每天换一个 */
    if(v > vBest){ vBest = v; iBest = i; }
  });
  return iBest;
}

function hash(str){
  var h = 0;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return h;
}

/* ===== 选择面板 ===== */
function buildSheet(){
  var snow = [], soon = [], none = [];
  mv.order.forEach(function(m, i){
    if(m.st==='snow' || m.st==='sleet') snow.push([m,i]);
    else if(m.st==='soon') soon.push([m,i]);
    else none.push([m,i]);
  });
  soon.sort(function(a,b){ return new Date(a[0].place.next||0) - new Date(b[0].place.next||0); });

  function rows(list, dotCls){
    return list.map(function(x){
      var m = x[0], i = x[1];
      var t = (m.place.temp!=null ? m.place.temp+'°' : '');
      var extra = m.st==='soon' && within(m.place.next,24) ? hhmm(m.place.next) : (m.place.mm ? m.place.mm+'cm' : '');
      return '<button class="row'+(i===mv.cur?' cur':'')+(m.st==='none'?' dim':'')+'" data-i="'+i+'">'+
        '<span><span class="nm">'+m.scene.name+'</span><span class="rg">'+m.scene.region+'</span></span>'+
        '<span class="rt">'+(extra?'<span>'+extra+'</span>':'')+'<span>'+t+'</span><span class="sd '+dotCls+'"></span></span>'+
      '</button>';
    }).join('');
  }

  var html = '';
  if(snow.length) html += '<div class="grp">正在下雪 · '+snow.length+'</div>'+rows(snow,'');
  if(soon.length) html += '<div class="grp">雪在路上 · '+soon.length+'</div>'+rows(soon,'soon');
  if(none.length) html += '<div class="grp">暂无降雪 · '+none.length+'</div>'+rows(none,'none');

  byId('sheetCount').textContent = mv.source ? (mv.source==='示例' ? '示例数据' : '已更新') : '';
  byId('sheetBody').innerHTML = html;
  byId('sheetFoot').innerHTML =
    '<button class="demo-row" id="demoRow"><span>演示：所有地点下雪</span>'+
    '<span class="toggle" role="switch" aria-checked="'+(mv.demo?'true':'false')+'" id="demoTog"></span></button>';

  Array.prototype.forEach.call(byId('sheetBody').querySelectorAll('.row'), function(el){
    el.addEventListener('click', function(){
      setPlace(parseInt(el.getAttribute('data-i'),10), false);
      closeSheet();
    });
  });
  byId('demoRow').addEventListener('click', function(){
    mv.demo = !mv.demo;
    byId('demoTog').setAttribute('aria-checked', mv.demo ? 'true':'false');
    mv.order = mv.order.map(function(m){ return { scene:m.scene, place:m.place, st: classify(m.place) }; });
    buildSheet();
    setPlace(mv.cur, false);
  });
}

var cloudApi = null, cloudState = 'idle', cloudErr = '', lastSend = 0;
var cloudTok = '', cloudTokAt = 0;

function withTimeout(promise, ms, tag){
  return Promise.race([promise, new Promise(function(_, rej){
    setTimeout(function(){ rej(new Error(tag || 'timeout')); }, ms);
  })]);
}
function cloudBase(){
  return 'https://' + CLOUD_ENV + '.api.tcloudbasegateway.com';
}
function deviceId(){
  var k = 'snowday_dev_id', v = null;
  try { v = localStorage.getItem(k); } catch(e){}
  if(!v){
    v = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem(k, v); } catch(e){}
  }
  return v;
}
function cloudLogin(){
  if(cloudTok && Date.now() - cloudTokAt < 3000000) return Promise.resolve(cloudTok);
  return withTimeout(
    fetch(cloudBase() + '/auth/v1/signin/anonymously', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId() },
      body: '{}'
    }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok || !j || !j.access_token) throw new Error((j && (j.message || j.msg)) || 'auth' + r.status);
        cloudTok = j.access_token;
        cloudTokAt = Date.now();
        return cloudTok;
      });
    }), 9000, 'auth');
}
function cloudFetch(path, opt, retried){
  return cloudLogin().then(function(tk){
    var o = opt || {};
    o.headers = Object.assign({
      'Content-Type': 'application/json',
      'x-device-id': deviceId(),
      'Authorization': 'Bearer ' + tk
    }, o.headers || {});
    return fetch(cloudBase() + path, o).then(function(r){
      if(r.status === 401 && !retried){
        cloudTok = '';
        return cloudFetch(path, opt, 1);
      }
      return r.text().then(function(txt){
        var j = null;
        try { j = txt ? JSON.parse(txt) : null; } catch(e){}
        if(!r.ok) throw new Error((j && (j.message || j.msg)) || ('http' + r.status));
        return j;
      });
    });
  });
}
function cloudList(pid){
  return withTimeout(cloudFetch(
    '/v1/rdb/rest/msgs?select=text&pid=eq.' + encodeURIComponent(pid) + '&order=ts.desc&limit=50'
  ), 9000, 'list').then(function(rows){
    return (rows || []).map(function(x){ return String(x.text || ''); });
  });
}
function cloudAdd(pid, text){
  return withTimeout(cloudFetch('/v1/rdb/rest/msgs', {
    method: 'POST',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ pid: pid, text: text })
  }), 9000, 'add');
}
function bootCloud(){
  if(!CLOUD_ENV) return Promise.resolve(null);
  if(cloudApi) return Promise.resolve(cloudApi);
  if(cloudState === 'loading'){
    return new Promise(function(res){
      var iv = setInterval(function(){
        if(cloudState !== 'loading'){ clearInterval(iv); res(cloudApi); }
      }, 120);
    });
  }
  cloudState = 'loading';
  return cloudLogin().then(function(){
    cloudApi = { list: cloudList, add: cloudAdd };
    cloudState = 'ready';
    return cloudApi;
  }).catch(function(err){
    cloudState = 'fail';
    cloudErr = (err && err.message) || 'error';
    return null;
  });
}

function pickFlake(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const px = (cx - rect.left) / rect.width * 2 - 1;
  const py = 1 - (cy - rect.top) / rect.height * 2;

const MAT = {

function box(w, h, d, mat, x, y, z, ry) {

/* 覆雪云杉：一层层锥体 + 每层落雪，比单薄的三层锥更像真树 */
function jaggedCone(r, hh, seg) {
  const geo = new THREE.ConeGeometry(r, hh, seg, 3);

  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y > -hh * 0.49) {
      const k = 1 + (Math.random() - 0.5) * 0.22;
      pos.setX(i, pos.getX(i) * k);
      pos.setZ(i, pos.getZ(i) * k);
    }
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, MAT.needle);
}

function spruce(h, x, z, tilt) {
  const g = new THREE.Group();
  const trunkH = h * 0.25;
  g.add(cyl(h * 0.03, h * 0.055, trunkH, 6, MAT.wood, 0, trunkH / 2, 0));
  const layers = [[h * 0.30, h * 0.26, 0.0], [h * 0.23, h * 0.26, 0.24], [h * 0.15, h * 0.30, 0.48]];
  for (const [r, hh, lift] of layers) {
    const y = trunkH + h * lift;
    const c = jaggedCone(r, hh, 11);
    c.position.set(0, y + hh * 0.5, 0);
    c.rotation.y = Math.random() * 3;
    g.add(c);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.55, hh * 0.42, 11), MAT.snowBright);
    cap.position.set(0, y + hh * 0.86, 0);

}

/* 暖光路灯：木杆 + 吊灯 + 光斑 + 地面光池 */
const lampRefs = [];
function lamp(g, x, z, h) {

  grp.add(box(0.16, 0.16, 0.16, MAT.dark, 1.15, h - 0.28, 0));
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.34, 10, 1, true), MAT.wood);
  shade.position.set(1.15, h - 0.5, 0);
  shade.rotation.x = Math.PI;
  grp.add(shade);
  const bulbMat = new THREE.MeshStandardMaterial({ color: 0x201208, emissive: 0xffb066, emissiveIntensity: 1.6 });
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), bulbMat);

  light.position.set(1.15, h - 0.7, 0);

  /* 地面光池 */
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(16, 16),
    new THREE.MeshBasicMaterial({ map: dotTex, color: 0xffb877, transparent: true, opacity: .22, depthWrite: false, blending: THREE.AdditiveBlending }));
  pool.rotation.x = -Math.PI / 2;

}

/* 木栅栏 */
function fence(g, x0, z0, len, dirX) {
  const grp = new THREE.Group();
  const n = Math.round(len / 1.6);
  for (let i = 0; i <= n; i++) {
    const px = dirX ? x0 + i * (len / n) : x0;
    const pz = dirX ? z0 : z0 + i * (len / n);
    const hh = 1.25 + Math.random() * 0.15;
    grp.add(box(0.14, hh, 0.14, MAT.wood, px, hh / 2, pz));
    grp.add(box(0.34, 0.10, 0.34, MAT.snowBright, px, hh + 0.03, pz));

/* ================= 地形 ================= */
function ground(cfg) {
  const size = 420, seg = 170;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const base = new THREE.Color(0x24313f), bright = new THREE.Color(0xeef5fd), c = new THREE.Color();
  const ridges = cfg.ridges || [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = (Math.sin(x * .11 + cfg.seed) * .5 + Math.cos(z * .13 - cfg.seed) * .5) * .55;
    h += Math.sin(x * .31 + z * .21) * .18 + Math.sin(x * 1.4) * .05 + Math.cos(z * 1.7) * .05;
    for (const r of ridges) {
      const d = Math.sqrt((x - r.x) ** 2 + (z - r.z) ** 2) / r.r;
      if (d < 1) {
        const shape = Math.pow(1 - d, r.sharp || 1.3);
        const crag = 1 + Math.sin(Math.atan2(z - r.z, x - r.x) * 6) * 0.06 * shape
          + Math.sin(x * 0.09 + z * 0.07) * 0.05 * shape;
        h += r.h * shape * crag;
      }
    }
    if (cfg.street) {
      const ax = Math.abs(x);
      if (ax < 6.5) h = 0;
      else if (ax < 11) h *= (ax - 6.5) / 4.5;
    }
    const rr = Math.sqrt(x * x + (z - 4) * (z - 4));
    if (rr > 48) h -= (rr - 48) * 0.22;
    pos.setY(i, h);
    const t = Math.min(1, Math.max(0, (h - 3) / 12));
    c.copy(base).lerp(bright, 0.22 + 0.78 * Math.pow(t, 1.25));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0, emissive: 0x101c2a, emissiveIntensity: 1 }));
  return mesh;
}

function road(g, cfg) {
  const len = 120;
  const grp = new THREE.Group();
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(10.5, len), new THREE.MeshStandardMaterial({ color: 0x869db4, roughness: .8 }));
  surf.rotation.x = -Math.PI / 2;
  surf.position.set(0, 0.02, -len / 2 + 8);
  grp.add(surf);
  for (const off of [-2.2, 2.2]) {
    const t = new THREE.Mesh(new THREE.PlaneGeometry(0.55, len), new THREE.MeshStandardMaterial({ color: 0x6c8296, roughness: .7 }));
    t.rotation.x = -Math.PI / 2;
    t.position.set(off, 0.035, -len / 2 + 8);
    grp.add(t);
  }
  /* 路肩雪堆 */
  const rnd = mulberry(cfg.seed + 5);
  for (let i = 0; i < 22; i++) {
    const side = i % 2 ? 1 : -1;
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.45 + rnd() * 0.55, 8, 6), MAT.snow);
    m.scale.set(2.6, 0.32, 1.4);
    m.position.set(side * (6.0 + rnd() * 1.6), 0.02, -50 + i * 5.6 + rnd());
    grp.add(m);
  }
  g.add(grp);
}

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  const base = new THREE.Color(0x1e2a37), bright = new THREE.Color(0xdde9f6), c = new THREE.Color();

  grp.add(box(.06, .58, W - .26, frontGlass, -L / 2 + .03, 1.5, 0));
  grp.add(box(.04, .62, .16, MAT.dark, -L / 2 + .03, 1.5, -HB + .12));
  grp.add(box(.04, .62, .16, MAT.dark, -L / 2 + .03, 1.5, HB - .12));

  const slots = 5;
  const segW = (L - 1.3) / slots;
  for (let i = 0; i < slots; i++) {
    const x = -L / 2 + .8 + segW * (i + .5);
    const m = i < 2 ? glassWarm : glassCool;
    for (const z of [-HB - .006, HB + .006]) {
      grp.add(box(segW - .14, .56, .03, m, x, 1.58, z));
      grp.add(box(.07, .56, .035, MAT.dark, x - segW / 2 + .02, 1.58, z));
    }
  }

  const routeMat = new THREE.MeshStandardMaterial({ color: 0x221f0e, emissive: 0xffcf7a, emissiveIntensity: 1.0 });
  grp.add(box(1.0, .14, .04, routeMat, -L / 2 + .62, 1.94, HB + .006));
  grp.add(box(1.0, .14, .04, routeMat, -L / 2 + .62, 1.94, -HB - .006));

  const doorMat = new THREE.MeshStandardMaterial({ color: 0x101d29, emissive: 0x28506e, emissiveIntensity: .38, roughness: .22, metalness: .45 });
  grp.add(box(.86, 1.1, .03, doorMat, -1.15, 1.3, -HB - .012));
  grp.add(box(.86, 1.1, .03, doorMat, 1.0, 1.3, -HB - .012));
  grp.add(box(.03, 1.1, .03, MAT.dark, -1.15, 1.3, -HB - .018));
  grp.add(box(.03, 1.1, .03, MAT.dark, 1.0, 1.3, -HB - .018));

  grp.add(box(1.1, .16, .7, MAT.dark, L / 2 - 1.1, 2.1, 0));

  for (const z of [-1, 1]) {
    grp.add(box(.1, .05, .26, MAT.dark, -L / 2 + .2, 1.82, z * (HB + .16)));
    grp.add(box(.07, .24, .04, glassCool, -L / 2 + .2, 1.72, z * (HB + .3)));
  }

  g.add(grp);
  busRef.grp = grp;
  busRef.wheels = wheels;
  const halfW = cam.dist * Math.tan(camera.fov * Math.PI / 360) * camera.aspect * 1.12;
  const edge = halfW + 4.6;
  busRef.from = edge;
  busRef.to = 2.1;
  busRef.exit = -edge;
  busRef.t = 0;
  busRef.dur = 4.4 * Math.max(1, Math.pow((busRef.from - busRef.to) / 12.3, .55));
  busRef.hold = 1.8;
  busRef.outDur = 4.6 * Math.max(1, Math.pow((busRef.to - busRef.exit) / 16.1, .55));
  busRef.phase = 'in';
  busRef.wait = 0;
  grp.position.set(busRef.from, 0, -20);
}

/* ================= 相机 ================= */
const cam = { az: 0.06, pitch: 0.10, look: 0, dist: 21, target: new THREE.Vector3(0, 2.4, -8), auto: 0, drag: false };
let lastX = 0, lastY = 0;

function applyCam() {
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    Math.sin(cam.az) * cp * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.az) * cp * cam.dist
  );
  const look = cam.target.clone();
  look.y += Math.tan(cam.look) * cam.dist;
  camera.lookAt(look);
}

function bindDrag() {
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    cam.drag = true; lastX = e.clientX; lastY = e.clientY;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!cam.drag) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    cam.az -= dx * 0.005;
    cam.look = Math.min(0.34, Math.max(-0.22, cam.look + dy * 0.0032));
    applyCam();
  });
  el.addEventListener('pointerup', () => cam.drag = false);
  el.addEventListener('pointercancel', () => cam.drag = false);
}

/* ================= 组装 ================= */
let curGroup = null;

let curSceneId = '';
function compose(id, name, sub) {
  if (curGroup && id === curSceneId) return;
  curSceneId = id;
  clearMsgs();
  if (held.l) closeCard(false);
  lampRefs.length = 0;
  if (curGroup) { scene.remove(curGroup); curGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  const rnd = mulberry(137);
  const g = new THREE.Group();
  g.add(groundCity());
  crossRoad(g);

  for (let i = 0; i < 16; i++) {
    const side = i % 2 ? 1 : -1;
    g.add(spruce(3.2 + rnd() * 4.6, side * (11 + rnd() * 17), -6 - rnd() * 44, true));
  }
  for (let i = 0; i < 12; i++) {
    g.add(spruce(2.6 + rnd() * 3.2, -48 + rnd() * 96, -62 - rnd() * 26, false));
  }

  lamp(g, -9.5, -12.5, 4.6);
  lamp(g, 7.4, -13.5, 5.2);
  fence(g, -26, -9.5, 16, true);

  if (camera.aspect > 1.25) {
    cam.target.set(-.4, 1.9, -24.0);
    cam.dist = 21;
    cam.pitch = 0.04;
    cam.look = 0.02;
    cam.az = -0.16;
  } else {
    cam.target.set(.2, 1.95, -22.0);
    cam.dist = 26;
    cam.pitch = 0.02;
    cam.look = 0.05;
    cam.az = -0.18;
  }
  applyCam();

  buildStop(g, name, sub);
  buildAcc(g);
  buildBus(g);

  scene.add(g);
  curGroup = g;

}

/* ================= 状态 ================= */
function setWeather(state, mm) {
  snowStrength = state === 'snow' ? Math.min(1, .5 + (mm || 0) * .12)
    : state === 'sleet' ? .34 : 0;
  snowLayers.forEach(l => {
    l.pts.visible = snowStrength > 0;
    l.pts.geometry.setDrawRange(0, Math.max(0, Math.round(l.count * snowStrength)));
    l.speed = l.baseSpeed * (.7 + snowStrength * .6);
    l.pts.material.opacity = l.baseAlpha * (.6 + snowStrength * .5);
  });
  stars.visible = true;
  scene.fog.density = snowStrength > 0 ? 0.015 : 0.012;
  moon.intensity = snowStrength > 0 ? 1.0 : 1.25;
}

/* ================= 主循环 ================= */
let last = performance.now();
function flick(t, off) {
  const p = (t + off + 4.1) % 8.2;
  if (p > .8) return 1;
  return .26 + .74 * Math.abs(Math.sin((p / .8) * Math.PI * 3));
}

function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  starMat.uniforms.uTime.value = t;

  /* 星空：只有抬头才看得到 */
  const want = starMat.uniforms.uFade.value;
  const starTarget = .8;
  starMat.uniforms.uFade.value = want + (starTarget - want) * Math.min(1, dt * 4);


  for (const l of snowLayers) {
    if (!l.pts.visible) continue;
    const arr = l.pts.geometry.attributes.position.array;
    const half = l.spread / 2;
    for (let i = 0; i < l.count; i++) {
      if (held.l === l && held.i === i) continue;
      const o = i * 3;
      arr[o + 1] -= l.speed * dt;
      arr[o] += Math.sin(t * .6 + l.seed[i]) * .20 * dt * 3 + .30 * dt * l.drift;
      arr[o + 2] += Math.cos(t * .45 + l.seed[i] * 1.3) * .12 * dt * 3 * l.drift;
      if (arr[o + 1] < -1) { arr[o + 1] = l.height; arr[o] = (Math.random() - .5) * l.spread; arr[o + 2] = (Math.random() - .5) * l.spread; }
      if (arr[o] > half) arr[o] -= l.spread;
      if (arr[o + 2] > half) arr[o + 2] -= l.spread;
    }
    l.pts.geometry.attributes.position.needsUpdate = true;
  }

  if (heldFlake.visible) {
    const breathe = 1.2 + Math.sin(t * 1.05) * .06;
    heldFlake.scale.set(breathe, breathe, 1);
    heldFlake.material.rotation = t * .09;
  }

  for (let i = flyingMsgs.length - 1; i >= 0; i--) {
    const m = flyingMsgs[i];
    m.t += dt;
    m.sp.position.y -= .85 * dt;
    m.sp.position.x += Math.sin(m.t * .7 + m.drift) * .12 * dt * 3 + .04 * dt;
    if (m.t > m.life - 2.6) m.sp.material.opacity = Math.max(0, (m.life - m.t) / 2.6);
    if (m.t > m.life || m.sp.position.y < -.5) {
      scene.remove(m.sp);
      m.sp.material.map.dispose(); m.sp.material.dispose();
      flyingMsgs.splice(i, 1);
    }
  }

  const fl = flick(t, 0);
  if (stopRef.lamp) stopRef.lamp.intensity = 40 * fl;
  if (stopRef.barMat) stopRef.barMat.emissiveIntensity = .6 + .8 * fl;
  if (stopRef.glow) stopRef.glow.material.opacity = .16 + .3 * fl;
  if (stopRef.pool) stopRef.pool.material.opacity = .07 + .12 * fl;
  for (const L of lampRefs) {
    const f = flick(t, L.off);
    L.light.intensity = 40 * f;
    L.bulbMat.emissiveIntensity = .9 + .8 * f;
    L.glow.material.opacity = .22 + .34 * f;
  }

  if (busRef.grp && busRef.phase !== 'done') {
    if (busRef.phase === 'in') {
      busRef.t = Math.min(1, busRef.t + dt / busRef.dur);
      const e = 1 - Math.pow(1 - busRef.t, 3);
      busRef.grp.position.x = busRef.from + (busRef.to - busRef.from) * e;
      busRef.wheels.forEach(w => { w.rotation.z -= (1 - busRef.t) * 9 * dt; });
      if (busRef.t >= 1) { busRef.phase = 'hold'; busRef.wait = 0; }
    } else if (busRef.phase === 'hold') {
      busRef.wait += dt;
      if (busRef.wait >= busRef.hold) { busRef.phase = 'out'; busRef.t = 0; }
    } else if (busRef.phase === 'out') {
      busRef.t = Math.min(1, busRef.t + dt / busRef.outDur);
      const e = busRef.t * busRef.t * busRef.t;
      busRef.grp.position.x = busRef.to + (busRef.exit - busRef.to) * e;
      busRef.wheels.forEach(w => { w.rotation.z -= busRef.t * 11 * dt; });
      if (busRef.t >= 1) busRef.phase = 'done';
    }
  }

  if (snowStrength > 0) {
    accRef.v = Math.min(1, accRef.v + dt * (.004 + snowStrength * .014));
    if (accRef.mat) accRef.mat.opacity = .55 * accRef.v;
    if (accRef.cover) accRef.cover.position.y = .06 + .012 * accRef.v;
    for (const m of accRef.drifts) m.scale.y = .18 + .5 * accRef.v;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  const wasLand = camera.aspect > 1.25;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if ((camera.aspect > 1.25) !== wasLand) {
    curSceneId = null;
    if (window.VS_PENDING && window.VS3D) {
      window.VS3D.show(window.VS_PENDING[0], window.VS_PENDING[1], window.VS_PENDING[2], window.VS_PENDING[3], window.VS_PENDING[4]);
    }
  }
});

snowFar.pts.position.set(0, 4, -4);
snowMid.pts.position.set(0, 4, -4);
snowNear.pts.position.set(0, 3, 2);
snowClose.pts.position.set(-3, 1, -9);
applyCam();
requestAnimationFrame(tick);

window.VS3D = { show: (id, state, mm, name, sub) => { compose(id, name, sub); setWeather(state, mm); }, ready: true };
if (window.VS_PENDING) window.VS3D.show(window.VS_PENDING[0], window.VS_PENDING[1], window.VS_PENDING[2], window.VS_PENDING[3], window.VS_PENDING[4]);

</script>
