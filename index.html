<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport‑fit=cover">
<meta name="theme‑color" content="#000000">
<title>全球雪景</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke='%23f2f4f6' stroke‑width='1.5' stroke‑linecap='round'%3E%3Cpath d='M12 2.5v19M4 7.2l16 9.6M4 16.8l16‑9.6'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --white:#F4F6F8;
  --gray:#8A9099;
  --gray‑2:#4C525A;
  --line:rgba(255,255,255,.14);
  --line‑soft:rgba(255,255,255,.07);
  --ease:cubic‑bezier(.22,1,.36,1);
}
*{box‑sizing:border‑box}
html,body{
  margin:0;padding:0;height:100%;background:#000;color:var(--white);
  font‑family:system‑ui,‑apple‑system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans‑serif;
  overflow:hidden;overscroll‑behavior:none;
  -webkit‑font‑smoothing:antialiased;-webkit‑tap‑highlight‑color:transparent;
}
button{font‑family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus‑visible{outline:1.5px solid rgba(255,255,255,.6);outline‑offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;background:#000;z‑index:1;}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z‑index:1;}
.vig{position:absolute;inset:0;z‑index:5;pointer‑events:none;
  background:
    radial‑gradient(118% 92% at 50% 46%, rgba(0,0,0,0) 38%, rgba(2,6,12,.36) 76%, rgba(2,5,10,.66) 100%),
    linear‑gradient(180deg, rgba(2,6,12,.30) 0%, rgba(0,0,0,0) 26%);
}

.glass{
  background:linear‑gradient(180deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.055) 46%, rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,255,255,.16);
  -webkit‑backdrop‑filter:blur(22px) saturate(180%);
  backdrop‑filter:blur(22px) saturate(180%);
  box‑shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 ‑1px 0 rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.45);
}

.pill{
  position:fixed;top:calc(16px + env(safe‑area‑inset‑top));left:16px;
  height:42px;padding:0 14px 0 12px;border‑radius:999px;
  display:inline‑flex;align‑items:center;gap:9px;
  z‑index:60;
  transition:transform .3s var(--ease);
}
.pill:active{transform:scale(.97)}
.pill .dot{
  width:6px;height:6px;border‑radius:50%;background:rgba(255,255,255,.85);
  box‑shadow:0 0 10px rgba(255,255,255,.75);flex:none;
}
.pill .dot.off{background:rgba(255,255,255,.28);box‑shadow:none}
.pill .dot.warn{background:rgba(255,255,255,.55);box‑shadow:0 0 8px rgba(255,255,255,.4)}
.pill .txt{
  font‑size:13px;letter‑spacing:.06em;white‑space:nowrap;color:rgba(255,255,255,.94);
}
.pill .chev{width:11px;height:11px;opacity:.6;flex:none;display:block}
.pill .chev svg{width:11px;height:11px;display:block}

.place{
  position:fixed;left:22px;bottom:calc(28px + env(safe‑area‑inset‑bottom));
  z‑index:58;pointer‑events:none;
  transition:opacity .4s var(--ease);
}
.place .cn{
  display:block;font‑weight:300;
  font‑size:29px;letter‑spacing:.16em;line‑height:1.2;
  text‑shadow:0 2px 22px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place .meta{
  display:block;margin‑top:5px;
  font‑size:10.5px;letter‑spacing:.3em;text‑transform:uppercase;color:rgba(255,255,255,.5);
  text‑shadow:0 1px 14px rgba(0,0,0,.95);
  transition:opacity .4s var(--ease);
}
.place.quiet .cn,.place.quiet .meta{opacity:.42}

.wx‑btn{
  position:fixed;right:16px;bottom:calc(28px + env(safe‑area‑inset‑bottom));
  width:52px;height:52px;border‑radius:50%;
  display:grid;place‑items:center;z‑index:60;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.32);
  box‑shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s var(--ease),background .25s var(--ease);
  cursor:pointer;
}
.wx‑btn:hover{background:rgba(255,255,255,0.28);}
.wx‑btn:active{transform:scale(.94)}
.wx‑btn svg{width:22px;height:22px;stroke:rgba(255,255,255,.92);fill:none;stroke‑width:1.6;filter:drop‑shadow(0 0 4px rgba(255,255,255,.35));}
.wx‑btn.on{background:rgba(74,158,255,.35);border‑color:rgba(140,200,255,.55)}

.wx{
  position:fixed;right:16px;bottom:calc(88px + env(safe‑area‑inset‑bottom));
  width:220px;border‑radius:18px;padding:14px 16px 15px;
  z‑index:59;transform‑origin:100% 100%;
  transform:translateY(8px) scale(.96);opacity:0;pointer‑events:none;
  transition:opacity .26s var(--ease),transform .32s var(--ease);
}
.wx.open{opacity:1;transform:none;pointer‑events:auto}
.wx .wtitle{
  font‑size:10px;letter‑spacing:.22em;color:var(--gray);
  display:flex;justify‑content:space‑between;align‑items:center;gap:8px;
}
.wx .wbig{margin‑top:9px;display:flex;align‑items:baseline;gap:8px}
.wx .wbig .t{font‑size:30px;line‑height:1;font‑variant‑numeric:tabular‑nums;letter‑spacing:‑.01em}
.wx .wbig .s{font‑size:11px;letter‑spacing:.1em;color:rgba(255,255,255,.72)}
.wx .wrows{margin‑top:12px;display:grid;gap:7px}
.wx .wr{
  display:flex;justify‑content:space‑between;gap:10px;
  font‑size:11.5px;color:var(--gray);letter‑spacing:.04em;
  border‑top:1px solid var(--line‑soft);padding‑top:7px;
}
.wx .wr b{font‑weight:400;color:rgba(255,255,255,.86);font‑variant‑numeric:tabular‑nums}

.sheet‑mask{
  position:fixed;inset:0;z‑index:70;background:rgba(0,0,0,.5);
  opacity:0;pointer‑events:none;transition:opacity .32s var(--ease);
}
.sheet‑mask.open{opacity:1;pointer‑events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z‑index:71;
  max‑height:74vh;display:flex;flex‑direction:column;
  border‑radius:22px 22px 0 0;
  background:linear‑gradient(180deg, rgba(26,28,33,.88) 0%, rgba(11,12,15,.94) 100%);
  -webkit‑backdrop‑filter:blur(28px) saturate(170%);
  backdrop‑filter:blur(28px) saturate(170%);
  border‑top:1px solid rgba(255,255,255,.14);
  box‑shadow:0 ‑18px 50px rgba(0,0,0,.55);
  transform:translateY(101%);
  transition:transform .42s var(--ease);
  padding‑bottom:env(safe‑area‑inset‑bottom);
}
.sheet.open{transform:none}
.sheet‑head{
  display:flex;align‑items:center;justify‑content:space‑between;
  padding:14px 20px 10px;flex:none;
}
.sheet‑head .h{font‑size:11px;letter‑spacing:.24em;color:var(--gray)}
.sheet‑head .n{font‑size:11px;letter‑spacing:.1em;color:rgba(255,255,255,.5);font‑variant‑numeric:tabular‑nums}
.sheet‑body{overflow‑y:auto;‑webkit‑overflow‑scrolling:touch;padding:0 10px 8px}
.sheet‑foot{flex:none;padding:0 10px calc(14px + env(safe‑area‑inset‑bottom))}
.grp{font‑size:10px;letter‑spacing:.22em;color:var(--gray‑2);padding:14px 10px 6px}
.row{
  display:flex;align‑items:center;gap:12px;width:100%;
  min‑height:56px;padding:10px 12px;border‑radius:14px;
  text‑align:left;transition:background .2s;
}
.row:active{background:rgba(255,255,255,.09)}
.row:hover{background:rgba(255,255,255,.05)}
.row .nm{font‑size:14.5px;letter‑spacing:.08em;line‑height:1.35}
.row .rg{display:block;font‑size:10px;letter‑spacing:.16em;color:var(--gray‑2);margin‑top:2px}
.row .rt{
  margin‑left:auto;font‑size:12px;color:rgba(255,255,255,.72);
  font‑variant‑numeric:tabular‑nums;letter‑spacing:.02em;
  display:flex;align‑items:center;gap:8px;
}
.row .sd{width:5px;height:5px;border‑radius:50%;background:rgba(255,255,255,.9);box‑shadow:0 0 8px rgba(255,255,255,.8)}
.row .sd.soon{background:rgba(255,255,255,.4);box‑shadow:none}
.row .sd.none{background:rgba(255,255,255,.16);box‑shadow:none}
.row.dim .nm{color:rgba(255,255,255,.55)}
.row.cur{background:rgba(255,255,255,.07)}
.grabber{width:38px;height:4px;border‑radius:2px;background:rgba(255,255,255,.22);margin:8px auto ‑2px;flex:none}
.demo‑row{
  display:flex;align‑items:center;justify‑content:space‑between;gap:12px;
  margin:4px 10px 8px;padding:12px;border‑radius:14px;
  border:1px solid var(--line‑soft);width:calc(100% ‑ 20px);
}
.demo‑row span{font‑size:12px;letter‑spacing:.08em;color:rgba(255,255,255,.7)}
.toggle{
  width:42px;height:24px;border‑radius:999px;background:rgba(255,255,255,.14);
  position:relative;flex:none;transition:background .25s;
}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border‑radius:50%;
  background:rgba(255,255,255,.9);transition:transform .3s var(--ease);
}
.toggle[aria‑checked="true"]{background:rgba(255,255,255,.55)}
.toggle[aria‑checked="true"]::after{transform:translateX(18px)}

@media (min‑width:768px){
  .pill{top:22px;left:24px;height:44px}
  .place{left:30px;bottom:34px}
  .place .cn{font‑size:33px}
  .wx‑btn{right:24px;bottom:34px}
  .wx{right:24px;bottom:92px}
  .sheet{left:auto;right:20px;bottom:20px;width:368px;border‑radius:20px;
    max‑height:74vh;transform:translateY(14px) scale(.97);opacity:0;
    transition:opacity .26s var(--ease),transform .3s var(--ease);
    border:1px solid rgba(255,255,255,.14);}
  .sheet.open{transform:none;opacity:1}
  .sheet‑mask{background:rgba(0,0,0,.26)}
}
@media (prefers‑reduced‑motion:reduce){
  *{transition‑duration:.01s!important;animation‑duration:.01s!important}
}
</style>

<body>

<script id="app‑engine">
(function(){
'use strict';
var SNOW_CODES = [71,73,75,77,85,86];
var SLEET_CODES = [66,67,68,79];
var CACHE_KEY = 'snowday.v2.cache';
var CACHE_MIN = 20;
var reduced = window.matchMedia('(prefers‑reduced‑motion: reduce)').matches;
var mv = { order:[], cur:‑1, demo:false, source:'' };

function pad(n){ return n<10 ? '0'+n : ''+n; }
function hhmm(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return '';
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function within(iso, h){
  if(!iso) return false;
  var t = new Date(iso).getTime();
  if(isNaN(t)) return false;
  var now = Date.now();
  return t‑now <= h*3600e3 && t‑now > ‑3600e3;
}
function getJSON(url, ms){
  var ctl = new AbortController();
  var timer = setTimeout(function(){ ctl.abort(); }, ms||9000);
  return fetch(url, {signal:ctl.signal})
    .then(function(r){ clearTimeout(timer); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .catch(function(e){ clearTimeout(timer); throw e; });
}
function byId(id){ return document.getElementById(id); }

function classify(p){
  if(mv.demo) return 'snow';
  if(p.snowing) return 'snow';
  if(p.sleet) return 'sleet';
  if(within(p.next, 24)) return 'soon';
  return 'none';
}
function stLabel(st){
  if(st==='snow') return mv.demo ? '演示降雪' : '正在下雪';
  if(st==='sleet') return '雨夹雪';
  if(st==='soon') return '即将下雪';
  return '无降雪';
}

function fromOpenMeteo(){
  var lat = SCENES.map(function(s){ return s.lat; }).join(',');
  var lon = SCENES.map(function(s){ return s.lon; }).join(',');
  var url = 'https://api.open‑meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
            '&current=weather_code,temperature_2m,snowfall,wind_speed_10m'+
            '&hourly=snowfall,weather_code&forecast_days=2&timezone=UTC';
  return getJSON(url, 10000).then(function(j){
    var arr = Array.isArray(j) ? j : [j];
    if(!arr.length) throw new Error('empty');
    return { source:'Open‑Meteo', places: arr.map(function(r, i){
      var c = r.current || {};
      var hr = r.hourly || {};
      var times = hr.time || [], sf = hr.snowfall || [], hc = hr.weather_code || [];
      var next = null, sum = 0, t0 = Date.now();
      for(var k=0;k<times.length;k++){
        var tt = new Date(times[k] + (times[k].length>16?'':'Z')).getTime();
        if(tt‑t0 < ‑3600e3) continue;
        if(tt‑t0 > 24*3600e3) break;
        if(SNOW_CODES.indexOf(hc[k])>‑1 || SLEET_CODES.indexOf(hc[k])>‑1){
          sum += (sf[k]||0);
          if(!next) next = new Date(tt).toISOString();
        }
      }
      return {
        id: SCENES[i].id,
        temp: (c.temperature_2m!=null ? Math.round(c.temperature_2m*10)/10 : null),
        wind: (c.wind_speed_10m!=null ? Math.round(c.wind_speed_10m*10)/10 : null),
        code: String(c.weather_code==null?'':c.weather_code),
        snowing: SNOW_CODES.indexOf(c.weather_code)>‑1,
        sleet: SLEET_CODES.indexOf(c.weather_code)>‑1,
        next: next, mm: Math.round(sum*10)/10
      };
    })};
  });
}

function apply(places, source){
  mv.source = source;
  mv.order = SCENES.map(function(s){
    var p = null;
    for(var k=0;k<places.length;k++){ if(places[k].id===s.id){ p = places[k]; break; } }
    if(!p) p = {id:s.id, temp:null, next:null, mm:0};
    return { scene:s, place:p, st: classify(p) };
  });
  buildSheet();
  var best = pickDefault();
  if(window.DEEP){
    for(var d=0;d<mv.order.length;d++){
      if(mv.order[d].scene.id === window.DEEP){ best = d; break; }
    }
  }
  setPlace(best < 0 ? 0 : best, true);
}

function pickDefault(){
  var iBest = ‑1, vBest = ‑1;
  var seed = new Date().toISOString().slice(0,10);
  mv.order.forEach(function(m, i){
    var v = 0;
    if(m.st==='snow') v = 1000 + (m.place.mm||0);
    else if(m.st==='sleet') v = 900 + (m.place.mm||0);
    else if(m.st==='soon') v = 500 ‑ Math.min(400, Math.max(0, (new Date(m.place.next||0)‑Date.now())/60e3));
    v += (Math.abs(hash(seed + m.scene.id)) % 1000) / 1000;
    if(v > vBest){ vBest = v; iBest = i; }
  });
  return iBest;
}
function hash(str){
  var h = 0;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return h;
}

function setPlace(i, instant){
  if(i<0 || i>=mv.order.length) return;
  var m = mv.order[i];
  mv.cur = i;
  var st = m.st;
  window.VS_PENDING = [m.scene.id, st];
  if(window.drawScene) window.drawScene(m.scene.id, st);
  byId('placeCn').textContent = m.scene.name;
  byId('placeMeta').textContent = m.scene.region;
  byId('place').classList.toggle('quiet', !(st==='snow' || st==='sleet'));
  setPill((st==='snow' || st==='sleet') ? 'on' : 'off', m.scene.name);
  fillWeather(m);
  if(!mv.weather) byId('wxCard').classList.remove('open');
}
function setPill(kind, txt){
  var d = byId('pillDot');
  d.className = 'dot' + (kind==='on' ? '' : (kind==='warn' ? ' warn' : ' off'));
  byId('pillTxt').textContent = txt;
}

var COND = {
  snow:'雪', sleet:'雨夹雪', none:'无降雪'
};
function fillWeather(m){
  var p = m.place, st = m.st;
  byId('wxPlace').textContent = m.scene.name;
  byId('wxTemp').textContent = (p.temp!=null ? p.temp+'°' : '—');
  byId('wxCond').textContent = st==='snow' ? (mv.demo?'演示':'正在下雪')
    : st==='sleet' ? '雨夹雪'
    : st==='soon' ? '即将下雪'
    : '无降雪';
  var rows = [
    ['风速', p.wind!=null ? p.wind+' m/s' : '—'],
    ['未来24小时降雪', p.mm ? p.mm+' cm' : '—'],
    ['开始降雪', within(p.next,24) ? hhmm(p.next) : '—'],
    ['状态', stLabel(st)]
  ];
  byId('wxRows').innerHTML = rows.map(function(r){
    return '<div class="wr"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';
  }).join('');
}

function buildSheet(){
  var snow = [], soon = [], none = [];
  mv.order.forEach(function(m, i){
    if(m.st==='snow' || m.st==='sleet') snow.push([m,i]);
    else if(m.st==='soon') soon.push([m,i]);
    else none.push([m,i]);
  });
  soon.sort(function(a,b){ return new Date(a[0].place.next||0) ‑ new Date(b[0].place.next||0); });
  function rows(list, dotCls){
    return list.map(function(x){
      var m = x[0], i = x[1];
      var t = (m.place.temp!=null ? m.place.temp+'°' : '');
      var extra = m.st==='soon' && within(m.place.next,24) ? hhmm(m.place.next) : (m.place.mm ? m.place.mm+'cm' : '');
      return '<button class="row'+(i===mv.cur?' cur':'')+(m.st==='none'?' dim':'')+'" data‑i="'+i+'">'+
        '<span><span class="nm">'+m.scene.name+'</span><span class="rg">'+m.scene.region+'</span></span>'+
        '<span class="rt">'+(extra?'<span>'+extra+'</span>':'')+'<span>'+t+'</span><span class="sd '+dotCls+'"></span></span>'+
      '</button>';
    }).join('');
  }
  var html = '';
  if(snow.length) html += '<div class="grp">正在下雪 · '+snow.length+'</div>'+rows(snow,'');
  if(soon.length) html += '<div class="grp">即将下雪 · '+soon.length+'</div>'+rows(soon,'soon');
  if(none.length) html += '<div class="grp">暂无降雪 · '+none.length+'</div>'+rows(none,'none');
  byId('sheetCount').textContent = '';
  byId('sheetBody').innerHTML = html;
  byId('sheetFoot').innerHTML =
    '<button class="demo‑row" id="demoRow"><span>演示：全部地点开启下雪</span>'+
    '<span class="toggle" role="switch" aria‑checked="'+(mv.demo?'true':'false')+'" id="demoTog"></span></button>';
  Array.prototype.forEach.call(byId('sheetBody').querySelectorAll('.row'), function(el){
    el.addEventListener('click', function(){
      setPlace(parseInt(el.getAttribute('data‑i'),10), false);
      closeSheet();
    });
  });
  byId('demoRow').addEventListener('click', function(){
    mv.demo = !mv.demo;
    byId('demoTog').setAttribute('aria‑checked', mv.demo ? 'true':'false');
    mv.order = mv.order.map(function(m){ return { scene:m.scene, place:m.place, st: classify(m.place) }; });
    buildSheet();
    setPlace(mv.cur, false);
  });
}

function openSheet(){
  buildSheet();
  byId('sheet').classList.add('open');
  byId('mask').classList.add('open');
  byId('pill').setAttribute('aria‑expanded','true');
}
function closeSheet(){
  byId('sheet').classList.remove('open');
  byId('mask').classList.remove('open');
  byId('pill').setAttribute('aria‑expanded','false');
}

byId('pill').addEventListener('click', function(){
  var open = byId('sheet').classList.contains('open');
  if(open) closeSheet(); else openSheet();
});
byId('mask').addEventListener('click', closeSheet);
byId('wxBtn').addEventListener('click', function(){
  mv.weather = !mv.weather;
  byId('wxCard').classList.toggle('open', mv.weather);
  byId('wxBtn').classList.toggle('on', mv.weather);
  byId('wxBtn').setAttribute('aria‑expanded', mv.weather ? 'true':'false');
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(byId('sheet').classList.contains('open')) closeSheet();
    else if(mv.weather){
      mv.weather = false;
      byId('wxCard').classList.remove('open');
      byId('wxBtn').classList.remove('on');
    }
    return;
  }
  if(byId('sheet').classList.contains('open')) return;
  if(e.key==='ArrowRight') setPlace((mv.cur+1)%mv.order.length, false);
  if(e.key==='ArrowLeft') setPlace((mv.cur‑1+mv.order.length)%mv.order.length, false);
});

var HS = location.hash.replace('#','').split('&');
if(HS.indexOf('demo')>‑1) mv.demo = true;
window.DEEP = '';
HS.forEach(function(kv){ if(kv.indexOf('p=')===0) window.DEEP = kv.slice(2); });

function loadData(force){
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  if(!force && cached && Date.now()‑cached.ts < CACHE_MIN*60e3 && cached.places && cached.places.length===SCENES.length){
    apply(cached.places, cached.source); return;
  }
  setPill('warn', '正在获取降雪…');
  fromOpenMeteo()
    .catch(function(){
      apply(FALLBACK, '示例数据');
    })
    .then(function(res){
      if(!res) return;
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), places:res.places, source:res.source})); }catch(e){}
      apply(res.places, res.source);
    });
}

setPlace(0, true);
loadData(false);
setInterval(function(){ loadData(true); }, CACHE_MIN*60e3);
})();
</script>

<script>
// 纯2D Canvas渲染，无three.js
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W,H;
let stars = [];
let snowList = [];
let showSnow = false;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  createStars();
}
window.addEventListener('resize',resize);

//星星，闪烁调慢
function createStars(){
  stars = [];
  const count = Math.floor((W*H)/1300);
  for(let i=0;i<count;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H*0.75,
      r:Math.random()*1.1+0.25,
      baseA:Math.random()*0.5+0.2,
      spd:Math.random()*0.0022+0.0006,
      phase:Math.random()*Math.PI*2
    })
  }
}

//雪花参数
function resetSnow(enable){
  showSnow = enable;
  snowList = [];
  if(!enable) return;
  const cnt = 450;
  for(let i=0;i<cnt;i++){
    snowList.push({
      x:Math.random()*W,
      y:Math.random()*‑H,
      r:Math.random()*2.2+0.6,
      ys:Math.random()*1.2+0.7,
      xDrift:Math.random()*0.4‑0.2,
      phase:Math.random()*Math.PI*2
    })
  }
}

//绘制背景：渐变夜空 + 多层雪山森林剪影
function drawBackground(){
  //夜空渐变
  const gradSky = ctx.createLinearGradient(0,0,0,H);
  gradSky.addColorStop(0,'#070e20');
  gradSky.addColorStop(0.45,'#122444');
  gradSky.addColorStop(1,'#203860');
  ctx.fillStyle = gradSky;
  ctx.fillRect(0,0,W,H);

  //远景大雪山剪影
  ctx.fillStyle='#141f33';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=120){
    let h = H*0.38 + Math.sin(x*0.007)*H*0.16 + Math.cos(x*0.013)*H*0.08;
    ctx.lineTo(x,h);
  }
  ctx.lineTo(W,H);
  ctx.fill();

  //中景山林
  ctx.fillStyle='#0f1726';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=80){
    let h = H*0.55 + Math.sin(x*0.011)*H*0.11;
    ctx.lineTo(x,h);
  }
  ctx.lineTo(W,H);
  ctx.fill();

  //近地雪地
  const gradGround = ctx.createLinearGradient(0,H*0.72,0,H);
  gradGround.addColorStop(0,'#a0b4d4');
  gradGround.addColorStop(1,'#354460');
  ctx.fillStyle = gradGround;
  ctx.fillRect(0,H*0.72,W,H*0.28);
}

function render(time){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  //绘制星星
  for(const s of stars){
    const tw = Math.sin(time*s.spd + s.phase);
    const alpha = s.baseA * (0.4 + 0.6*tw);
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+alpha+')';
    ctx.fill();
  }

  //绘制雪花
  if(showSnow){
    for(const f of snowList){
      f.y += f.ys;
      f.x += f.xDrift + Math.sin(time*0.0015+f.phase)*0.22;
      if(f.y>H+10){
        f.y = ‑10;
        f.x = Math.random()*W;
      }
      if(f.x>W+10) f.x=‑10;
      if(f.x<‑10) f.x=W+10;
      const g = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      g.addColorStop(0,'rgba(255,255,255,0.92)');
      g.addColorStop(0.6,'rgba(255,255,255,0.45)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  requestAnimationFrame(render);
}

window.drawScene = function(id,status){
  resetSnow(status==='snow' || status==='sleet');
};

resize();
requestAnimationFrame(render);
</script>
