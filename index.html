<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SnowDay 雪景</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#080812;color:#fff;font-family:system-ui}
#weatherCard{position:fixed;top:16px;right:16px;background:rgba(0,0,0,0.55);padding:10px 14px;border-radius:10px;font-size:14px;z-index:10;line-height:1.6}
#tip{position:fixed;bottom:16px;left:16px;background:rgba(0,0,0,0.55);padding:6px 10px;border-radius:6px;font-size:13px;z-index:10}
canvas{display:block}
</style>
</head>
<body>
<div id="weatherCard">正在获取天气...</div>
<div id="tip">拖拽画面可旋转视角</div>

<script src="https://cdn.jsdmirror.com/npm/three@0.160.0/build/three.min.js"></script>
<script>
// 你的天气代理地址
const proxyBase = "https://snow-meteo-proxy.vercel.app/api/proxy-meteo";
// 阿勒泰坐标
const lat = 48.42, lon = 87.42;
let scene,camera,renderer,snowMesh,snowCount = 800;
let fallSpeed = 0.15;

// 天气代码对应文字
function getWeatherText(code){
  if(code === 0) return "晴朗";
  if(code <= 3) return "多云";
  if(code >= 45 && code <= 48) return "雾";
  if(code >= 51 && code <= 67) return "降雨";
  if(code === 71 || code === 73) return "小雪";
  if(code === 75 || code === 77) return "大雪";
  if(code >= 80 && code <= 82) return "阵雨";
  if(code === 85 || code === 86) return "暴雪";
  return "未知天气";
}

function init3D(){
  if (!window.THREE) {
    document.getElementById("weatherCard").innerText = "❌ 3D库加载失败";
    return;
  }
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75,window.innerWidth / window.innerHeight,0.1,2000);
  camera.position.z = 80;
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  createSnow(snowCount);

  window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  })
  animate();
}

function createSnow(count){
  if(snowMesh) scene.remove(snowMesh);
  const snowGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for(let i=0;i<count;i++){
    pos[i*3] = (Math.random()-0.5)*200;
    pos[i*3+1] = Math.random()*120;
    pos[i*3+2] = (Math.random()-0.5)*200;
  }
  snowGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const snowMat = new THREE.PointsMaterial({color:0xffffff,size:0.7,transparent:true,opacity:0.7});
  snowMesh = new THREE.Points(snowGeo,snowMat);
  scene.add(snowMesh);
}

async function fetchWeather(){
  const card = document.getElementById("weatherCard");
  try{
    // 同时请求：天气代码、温度、降雪量
    const url = `${proxyBase}?latitude=${lat}&longitude=${lon}&current=weather_code,temperature_2m,snowfall`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("代理返回错误");
    const data = await res.json();
    const cur = data.current;
    const code = cur.weather_code;
    const temp = cur.temperature_2m;
    const snow = cur.snowfall || 0;

    // 天气决定雪花密度和速度
    let text = getWeatherText(code);
    if(code >= 71 && code <= 77){
      snowCount = 600 + snow*200;
      fallSpeed = 0.15 + snow*0.2;
    } else if(code >= 85 && code <= 86){
      snowCount = 1800;
      fallSpeed = 0.5;
    } else if(code >= 51 && code <= 67){
      snowCount = 200;
      fallSpeed = 0.08;
    } else {
      snowCount = 80;
      fallSpeed = 0.05;
    }
    createSnow(snowCount);

    card.innerHTML = `阿勒泰<br>${text} ${temp}℃<br>降雪量：${snow}mm`;
  }catch(e){
    card.innerText = "⚠️ 天气加载失败\n模拟降雪场景";
    console.error(e);
    snowCount = 800;
    fallSpeed = 0.15;
    createSnow(snowCount);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const arr = snowMesh.geometry.attributes.position.array;
  for(let i=0;i<arr.length;i++){
    if(i%3===1){
      arr[i] -= fallSpeed;
      if(arr[i] < -10) arr[i] = 120;
    }
  }
  snowMesh.geometry.attributes.position.needsUpdate = true;
  renderer.render(scene,camera);
}

(async ()=>{
  init3D();
  await fetchWeather();
})();
</script>
</body>
</html>
