<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雪景实时天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080b14;font-family:system-ui,sans-serif;color:#fff}

/* 星空层 四向星芒 */
#starfield{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  opacity:0;transition:opacity 1.3s ease;
}
#starfield.active{opacity:1}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 8px 2px rgba(255,255,255,0.95),
    0 0 18px 5px rgba(130,190,255,0.6),
    0 0 30px 9px rgba(90,150,255,0.35);
  animation:twinkle var(--dur) ease-in-out infinite;
  animation-delay:var(--del);
}
.star::before,.star::after{
  content:"";position:absolute;left:50%;top:50%;
  width:1px;height:var(--ray);
  background:linear-gradient(to bottom,transparent 0%,rgba(255,255,255,0.9) 50%,transparent 100%);
  transform-origin:center;
}
.star::before{transform:translate(-50%,-50%) rotate(0deg)}
.star::after{transform:translate(-50%,-50%) rotate(90deg)}
.ray-d1{
  position:absolute;left:50%;top:50%;width:1px;height:var(--ray);
  background:linear-gradient(to bottom,transparent 0%,rgba(180,220,255,0.65) 50%,transparent 100%);
  transform-origin:center;
  transform:translate(-50%,-50%) rotate(45deg);
}
.ray-d2{
  position:absolute;left:50%;top:50%;width:1px;height:var(--ray);
  background:linear-gradient(to bottom,transparent 0%,rgba(180,220,255,0.65) 50%,transparent 100%);
  transform-origin:center;
  transform:translate(-50%,-50%) rotate(135deg);
}
@keyframes twinkle{
  0%,100%{opacity:0.2;transform:scale(0.75);filter:brightness(0.65)}
  50%{opacity:1;transform:scale(1.25);filter:brightness(1.55)}
}

/* 雪花画布 */
#snowCanvas{
  position:fixed;inset:0;z-index:2;pointer-events:none;
}

/* UI 基础 */
.ui-wrap{
  position:fixed;z-index:10;
}
.weather-btn{
  right:16px;bottom:16px;
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.22);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(6px);
}
.weather-btn svg{width:24px;height:24px;color:#fff}

/* 地点弹窗，横屏适配 */
.place-panel{
  position:fixed;
  left:12px;bottom:80px;
  width:clamp(260px,32vw,380px);
  max-height:55vh;
  background:rgba(10,15,25,0.75);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;
  padding:14px;
  overflow-y:auto;
  backdrop-filter:blur(8px);
  display:none;
}
.place-panel.show{display:block}
.place-item{
  padding:9px 6px;border-radius:8px;cursor:pointer;
  margin:4px 0;
  background:rgba(255,255,255,0.06);
}
.place-item:hover{background:rgba(255,255,255,0.14)}

/* 缩放提示 */
.tip-text{
  position:fixed;left:14px;top:14px;
  font-size:13px;color:rgba(255,255,255,0.72);
  z-index:9;
}
</style>
</head>
<body>
<div class="tip-text">滚轮放大缩小 | 点击右下角温度计查看地点天气</div>
<div id="starfield"></div>
<canvas id="snowCanvas"></canvas>

<div class="ui-wrap">
  <div id="placePanel" class="place-panel"></div>
  <div id="weatherBtn" class="weather-btn">
    <!-- 标准温度计图标 -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.5 14.5V4a2.5 2.5 0 0 1 5 0v10.5a4 4 0 1 1-5 0Z"/>
      <path d="M13 7h2M13 10h2M13 13h2"/>
    </svg>
  </div>
</div>

<script>
// 1. 星空生成
const starfield = document.getElementById("starfield");
function buildStars(){
  starfield.innerHTML = "";
  const cnt = Math.floor(Math.min(window.innerWidth,1500)/8);
  for(let i=0;i<cnt;i++){
    const s = document.createElement("span");
    s.className = "star";
    const sz = Math.random()*1.6 + 0.5;
    const rayLen = 16 + Math.random()*20;
    const dur = 2.2 + Math.random()*5;
    const del = Math.random()*-6;
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.width = sz + "px";
    s.style.height = sz + "px";
    s.style.setProperty("--ray", rayLen + "px");
    s.style.setProperty("--dur", dur + "s");
    s.style.setProperty("--del", del + "s");

    const r1 = document.createElement("span"); r1.className="ray-d1";
    const r2 = document.createElement("span"); r2.className="ray-d2";
    s.appendChild(r1); s.appendChild(r2);
    starfield.appendChild(s);
  }
}
buildStars();
window.addEventListener("resize", buildStars);

// 2. 雪花系统，多层景深、随机轨迹
const canvas = document.getElementById("snowCanvas");
const ctx = canvas.getContext("2d");
let w,h;
let snowList = [];
let snowActive = false;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

class Snow{
  constructor(){
    this.reset();
  }
  reset(){
    this.x = Math.random() * w;
    this.y = Math.random() * -h;
    this.depth = Math.random(); // 0远 ~1近
    this.size = 1 + this.depth * 4;
    this.speedY = 0.8 + this.depth * 2.2;
    this.wobbleSpeed = 0.02 + Math.random()*0.04;
    this.wobbleAmp = 10 + Math.random()*25;
    this.phase = Math.random() * Math.PI * 2;
    this.opacity = 0.25 + this.depth * 0.7;
  }
  update(){
    this.phase += this.wobbleSpeed;
    this.x += Math.sin(this.phase) * this.wobbleAmp * 0.04;
    this.y += this.speedY;
    if(this.y > h + 20) this.reset();
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    ctx.fill();
  }
}
function initSnow(count=900){
  snowList = [];
  for(let i=0;i<count;i++) snowList.push(new Snow());
}
function renderSnow(){
  ctx.clearRect(0,0,w,h);
  if(!snowActive){requestAnimationFrame(renderSnow);return;}
  for(let s of snowList){
    s.update();
    s.draw();
  }
  requestAnimationFrame(renderSnow);
}
initSnow();
renderSnow();
function setSnow(flag){
  snowActive = flag;
  starfield.classList.toggle("active", !flag);
}
setSnow(false);

// 3. 地点列表 + 实时天气 api-us
const placePanel = document.getElementById("placePanel");
const weatherBtn = document.getElementById("weatherBtn");
const places = [
  {name:"阿勒泰",lat:47.85,lon:88.13},
  {name:"哈尔滨",lat:45.75,lon:126.63},
  {name:"长春",lat:43.88,lon:125.32},
  {name:"沈阳",lat:41.80,lon:123.43},
  {name:"乌鲁木齐",lat:43.83,lon:87.62},
  {name:"北京",lat:39.90,lon:116.40},
  {name:"拉萨",lat:29.65,lon:91.10},
  {name:"杭州",lat:30.27,lon:120.15},
  {name:"成都",lat:30.67,lon:104.02},
  {name:"三亚",lat:18.25,lon:109.52}
];
async function fetchWeather(p){
  try{
    const url = `https://api-us.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,snowfall&timezone=auto`;
    const res = await fetch(url,{signal:AbortSignal.timeout(9000)});
    const d = await res.json();
    const cur = d.current;
    const snow = cur.snowfall > 0;
    return {temp:cur.temperature_2m, snow};
  }catch(e){
    return {temp:"--", snow:false};
  }
}
async function renderPlaceList(){
  placePanel.innerHTML = "";
  for(let p of places){
    const info = await fetchWeather(p);
    const div = document.createElement("div");
    div.className = "place-item";
    div.innerText = `${p.name} | ${info.temp}℃ ${info.snow ? "❄下雪" : ""}`;
    div.onclick = ()=> setSnow(info.snow);
    placePanel.appendChild(div);
  }
}
weatherBtn.onclick = async (e)=>{
  e.stopPropagation();
  placePanel.classList.toggle("show");
  if(placePanel.classList.contains("show")) renderPlaceList();
};
document.addEventListener("click",(e)=>{
  if(!placePanel.contains(e.target) && !weatherBtn.contains(e.target)){
    placePanel.classList.remove("show");
  }
});

// 4. 画布缩放
let scale = 1;
canvas.onwheel = (e)=>{
  e.preventDefault();
  scale += e.deltaY * -0.0012;
  scale = Math.max(0.4, Math.min(3.2, scale));
  canvas.style.transform = `scale(${scale})`;
}
</script>
</body>
</html>
