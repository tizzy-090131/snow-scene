<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雪境 · 3D氛围场景</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050810;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#app{position:relative;width:100%;height:100%}
.ui-wrap{position:fixed;z-index:10;inset:0;pointer-events:none}
.ui-wrap>*{pointer-events:auto}
.btn-place{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:10px 16px;
  background:rgba(20,30,48,0.75);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:12px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  backdrop-filter:blur(6px);
}
.place-panel{
  position:fixed;
  left:12px;
  bottom:70px;
  width:clamp(250px,32vw,340px);
  max-height:46vh;
  background:rgba(10,16,28,0.72);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:14px;
  padding:12px;
  overflow-y:auto;
  backdrop-filter:blur(8px);
  display:none;
}
.place-panel.show{display:block}
.place-item{
  padding:7px 9px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  transition:0.18s;
}
.place-item:hover{background:rgba(255,255,255,0.1)}
.place-item.active{background:rgba(120,170,255,0.22)}
.info-tip{
  position:absolute;
  right:12px;
  bottom:12px;
  padding:9px 13px;
  background:rgba(10,16,28,0.65);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  font-size:12px;
  backdrop-filter:blur(6px);
}
.snow-toggle{
  position:absolute;
  right:12px;
  top:12px;
  padding:9px 14px;
  background:rgba(10,16,28,0.7);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  font-size:13px;
  cursor:pointer;
  backdrop-filter:blur(6px);
}
</style>
</head>
<body>
<div id="app">
  <canvas id="mainCanvas"></canvas>
  <div class="ui-wrap">
    <button class="btn-place" id="btnPlace">切换地点</button>
    <div class="place-panel" id="placePanel"></div>
    <div class="info-tip">滚轮缩放 · 点击地点切换远景</div>
    <button class="snow-toggle" id="snowToggle">下雪：开启</button>
  </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();
addEventListener('resize',resize);

// 地点列表 + 对应绘制标识
const placeList = [
  {id:'altai',name:'阿勒泰'},
  {id:'changbaishan',name:'长白山'},
  {id:'shangrila',name:'香格里拉'},
  {id:'niantanggula',name:'念青唐古拉'},
  {id:'hulunbuir',name:'呼伦贝尔'},
  {id:'tianshan',name:'天山'},
  {id:'qilianshan',name:'祁连山'},
  {id:'gongga',name:'贡嘎雪山'},
  {id:'k2',name:'乔戈里峰'},
  {id:'meili',name:'梅里雪山'},
  {id:'daocheng',name:'稻城亚丁'},
  {id:'helan',name:'贺兰山'},
  {id:'harbin',name:'哈尔滨'},
  {id:'changchun',name:'长春'},
  {id:'shenyang',name:'沈阳'},
  {id:'lhasa',name:'拉萨'},
  {id:'beijing',name:'北京'},
  {id:'hangzhou',name:'杭州'},
  {id:'fuji',name:'富士山'},
  {id:'sapporo',name:'札幌'},
  {id:'matterhorn',name:'马特洪峰'},
  {id:'jungfrau',name:'少女峰'},
  {id:'rovaniemi',name:'罗瓦涅米'},
  {id:'tromso',name:'特罗姆瑟'},
  {id:'banff',name:'班夫落基山'},
  {id:'kilimanjaro',name:'乞力马扎罗'},
  {id:'montblanc',name:'勃朗峰'},
  {id:'rainier',name:'雷尼尔山'}
];
let currentPlace = 'altai';
let snowOn = true;
let scale = 1;
let stars = [];
let snowParticles = [];

// 星空初始化
function initStar(){
  stars = [];
  for(let i=0;i<350;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height*0.72,
      r:Math.random()*0.65+0.15,
      twinkle:Math.random()*Math.PI*2,
      speed:0.015+Math.random()*0.03
    })
  }
}
initStar();

// 雪花粒子
function createSnow(){
  snowParticles = [];
  for(let i=0;i<180;i++){
    snowParticles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*2.2+0.4,
      vy:Math.random()*1.2+0.6,
      vx:Math.random()*0.4-0.2,
      opacity:Math.random()*0.55+0.25
    })
  }
}
createSnow();

// 绘制星空
function drawStar(time){
  stars.forEach(s=>{
    s.twinkle += s.speed;
    const alpha = 0.35 + Math.sin(s.twinkle)*0.32;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  })
}

// 绘制雪花
function drawSnow(){
  if(!snowOn) return;
  snowParticles.forEach(p=>{
    p.y += p.vy;
    p.x += p.vx;
    if(p.y>canvas.height){
      p.y = -5;
      p.x = Math.random()*canvas.width;
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
    ctx.fill();
  })
}

// 【核心：Canvas 手绘各地标远景氛围】
function drawLandmark(pid){
  const w = canvas.width;
  const h = canvas.height;
  const horizon = h * 0.68;
  ctx.save();
  ctx.scale(scale,scale);
  const fogAlpha = snowOn ? 0.35 : 0.75;

  // 通用夜空渐变基底
  const skyGrad = ctx.createLinearGradient(0,0,0,horizon+80);
  skyGrad.addColorStop(0,'#040814');
  skyGrad.addColorStop(1,'#0b1528');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,w,horizon+100);

  ctx.globalAlpha = fogAlpha;

  // 逐个地点轮廓绘制
  if(pid==='altai'){
    // 阿勒泰：远山 + 村落暖光 + 木栅栏
    ctx.fillStyle='#121c2e';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.quadraticCurveTo(w*0.25,horizon-90,w*0.45,horizon-140);
    ctx.quadraticCurveTo(w*0.7,horizon-100,w,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
    // 暖光点
    for(let i=0;i<12;i++){
      const lx = w*(0.15+i*0.07);
      const ly = horizon + 15 + Math.sin(i*1.4)*12;
      ctx.beginPath();
      ctx.arc(lx,ly,1.8,0,Math.PI*2);
      ctx.fillStyle='#ffd888';ctx.fill();
    }
  }else if(pid==='changbaishan'){
    // 长白山 天池火山
    ctx.fillStyle='#101a2c';
    ctx.beginPath();
    ctx.moveTo(w*0.2,horizon);
    ctx.lineTo(w*0.38,horizon-160);
    ctx.lineTo(w*0.62,horizon-160);
    ctx.lineTo(w*0.8,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
    // 天池湖面
    ctx.beginPath();
    ctx.ellipse(w/2,horizon-45,w*0.13,24,0,0,Math.PI*2);
    ctx.fillStyle='#163052';ctx.fill();
  }else if(pid==='shangrila'){
    // 香格里拉 藏式金顶寺庙+经幡
    ctx.fillStyle='#11192b';
    ctx.beginPath();
    ctx.moveTo(w*0.35,horizon-110);
    ctx.lineTo(w*0.5,horizon-180);
    ctx.lineTo(w*0.65,horizon-110);
    ctx.lineTo(w*0.72,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
    ctx.beginPath();
    ctx.arc(w/2,horizon-170,9,0,Math.PI*2);
    ctx.fillStyle='#ffdd77';ctx.fill();
  }else if(pid==='niantanggula'){
    // 念青唐古拉 高原湖湾冰川远山
    ctx.fillStyle='#101b30';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.quadraticCurveTo(w*0.35,horizon-130,w*0.55,horizon-175);
    ctx.quadraticCurveTo(w*0.8,horizon-115,w,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w*0.3,horizon+10);
    ctx.quadraticCurveTo(w*0.5,horizon-10,w*0.72,horizon+10);
    ctx.fillStyle='#142b4c';ctx.fill();
  }else if(pid==='hulunbuir'){
    // 呼伦贝尔 草原+蒙古包
    ctx.fillStyle='#0f1726';
    ctx.beginPath();
    ctx.moveTo(0,horizon+10);
    ctx.quadraticCurveTo(w*0.5,horizon-25,w,horizon+10);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
    // 蒙古包轮廓
    ctx.beginPath();
    ctx.arc(w*0.32,horizon+12,22,Math.PI,0);
    ctx.lineTo(w*0.32-22,horizon+12);ctx.fill();
    ctx.beginPath();
    ctx.arc(w*0.68,horizon+14,18,Math.PI,0);
    ctx.lineTo(w*0.68-18,horizon+14);ctx.fill();
  }else if(pid==='tianshan'){
    ctx.fillStyle='#101a2c';
    ctx.beginPath();
    ctx.moveTo(w*0.18,horizon);
    ctx.lineTo(w*0.42,horizon-210);
    ctx.lineTo(w*0.58,horizon-150);
    ctx.lineTo(w*0.85,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='qilianshan'){
    ctx.fillStyle='#131c2e';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.quadraticCurveTo(w*0.22,horizon-75,w*0.4,horizon-120);
    ctx.quadraticCurveTo(w*0.65,horizon-85,w,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='gongga'){
    ctx.fillStyle='#10192a';
    ctx.beginPath();
    ctx.moveTo(w*0.33,horizon);
    ctx.lineTo(w*0.5,horizon-225);
    ctx.lineTo(w*0.67,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='k2'){
    ctx.fillStyle='#0f1828';
    ctx.beginPath();
    ctx.moveTo(w*0.38,horizon);
    ctx.lineTo(w*0.5,horizon-240);
    ctx.lineTo(w*0.62,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='meili'){
    ctx.fillStyle='#111a2b';
    ctx.beginPath();
    ctx.moveTo(w*0.15,horizon);
    ctx.lineTo(w*0.32,horizon-135);
    ctx.lineTo(w*0.44,horizon-170);
    ctx.lineTo(w*0.56,horizon-145);
    ctx.lineTo(w*0.75,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='daocheng'){
    ctx.fillStyle='#111a2b';
    ctx.beginPath();
    ctx.moveTo(w*0.28,horizon);
    ctx.lineTo(w*0.38,horizon-155);
    ctx.lineTo(w*0.5,horizon-190);
    ctx.lineTo(w*0.63,horizon-140);
    ctx.lineTo(w*0.74,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='helan'){
    ctx.fillStyle='#121b2d';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.quadraticCurveTo(w*0.45,horizon-95,w,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='harbin'){
    ctx.fillStyle='#121b2d';
    ctx.beginPath();
    ctx.moveTo(w*0.2,horizon);
    ctx.lineTo(w*0.3,horizon-85);
    ctx.lineTo(w*0.4,horizon);
    ctx.quadraticCurveTo(w*0.65,horizon-65,w*0.8,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='lhasa'){
    ctx.fillStyle='#10192a';
    ctx.beginPath();
    ctx.moveTo(w*0.35,horizon);
    ctx.lineTo(w*0.5,horizon-130);
    ctx.lineTo(w*0.65,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='fuji'){
    ctx.fillStyle='#111a2b';
    ctx.beginPath();
    ctx.moveTo(w*0.3,horizon);
    ctx.lineTo(w*0.5,horizon-190);
    ctx.lineTo(w*0.7,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='matterhorn'){
    ctx.fillStyle='#0f1726';
    ctx.beginPath();
    ctx.moveTo(w*0.38,horizon);
    ctx.lineTo(w*0.5,horizon-220);
    ctx.lineTo(w*0.62,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else if(pid==='tromso'){
    ctx.fillStyle='#101a2c';
    ctx.beginPath();
    ctx.moveTo(w*0.36,horizon);
    ctx.lineTo(w*0.5,horizon-110);
    ctx.lineTo(w*0.64,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }else{
    // 其余地点统一柔和远山兜底
    ctx.fillStyle='#111a2b';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    ctx.quadraticCurveTo(w*0.48,horizon-110,w,horizon);
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
  }
  ctx.restore();
}

// 渲染主循环
function render(time){
  ctx.fillStyle='#03060d';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawStar(time);
  drawLandmark(currentPlace);
  drawSnow();
  requestAnimationFrame(render);
}

// 滚轮缩放
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  scale = Math.max(0.55,Math.min(2.2,scale - e.deltaY*0.0008));
})

// UI 地点列表渲染
const panel = document.getElementById('placePanel');
const btnPlace = document.getElementById('btnPlace');
const snowBtn = document.getElementById('snowToggle');
placeList.forEach(p=>{
  const div = document.createElement('div');
  div.className = 'place-item';
  div.innerText = p.name;
  div.dataset.id = p.id;
  div.onclick = ()=>{
    currentPlace = p.id;
    document.querySelectorAll('.place-item').forEach(i=>i.classList.remove('active'));
    div.classList.add('active');
    panel.classList.remove('show');
  }
  panel.appendChild(div);
})
btnPlace.onclick = ()=>panel.classList.toggle('show');
snowBtn.onclick = ()=>{
  snowOn = !snowOn;
  snowBtn.innerText = `下雪：${snowOn?'开启':'关闭'}`;
}

requestAnimationFrame(render);
</script>
</body>
</html>
